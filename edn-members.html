<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDN48 Members</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app edn"><header class="top glass"><a href="edn48.html">‹</a><div class="brand">EDN48 MEMBERS</div><a href="admin.html">⚙</a></header><section class="section"><div class="member-showcase" id="memberHero"><div class="member-copy"></div><div class="member-photo-large"></div></div><div class="member-tabs" id="tabs"></div><div class="section-head"><div><span class="eyebrow soft">PROFILE DIRECTORY</span><h2>MEMBERS</h2></div><span class="count" id="count">0</span></div><div class="member-grid" id="memberGrid"></div></section></main><nav class="bottom"><a href="edn48.html"><span>⌂</span>Home</a><a class="active" href="edn-members.html"><span>☷</span>Members</a><a href="edn-club.html"><span>♛</span>EDEN</a><a href="edn-music.html"><span>♫</span>Music</a><a href="account.html"><span>●</span>Account</a></nav><script>(()=>{const g='EDN48',K=WTS.K,read=WTS.read,esc=WTS.esc;let gen='ALL',timer;function data(){return read(K.members,{})[g]||[]}function render(){const a=data(),list=gen==='ALL'?a:a.filter(x=>String(x.gen)===gen);document.getElementById('count').textContent=list.length+' MEMBERS';document.getElementById('memberGrid').innerHTML=list.map((m,i)=>`<article class="member-card"><div class="member-photo">${m.photo?`<img src="${m.photo}" alt="">`:'<span>✦</span>'}</div><div class="member-info"><div class="member-name-row"><b>${esc(m.name)}</b><span>GEN ${esc(m.gen||'?')}}</span></div><small>${esc(m.real||'Member')}</small><small>${m.bio?esc(m.bio):'A little star in '+g}</small></div></article>`).join('')||'<div class="empty-card">ยังไม่มีสมาชิกในรุ่นนี้</div>';document.querySelectorAll('.member-tabs a').forEach(x=>x.classList.toggle('active',x.dataset.gen===gen));}function hero(){const a=data();if(!a.length){document.querySelector('.member-copy').innerHTML='<span class="eyebrow">MEMBERS</span><h1>YOUR SHINING CAST</h1><p>เพิ่มสมาชิกจาก Admin เพื่อให้แบนเนอร์เริ่มหมุนอัตโนมัติ</p>';return}let i=0;const box=document.getElementById('memberHero');function go(){const m=a[i++%a.length];box.classList.remove('hero-in');void box.offsetWidth;box.classList.add('hero-in');document.querySelector('.member-copy').innerHTML=`<span class="eyebrow">GENERATION ${esc(m.gen||'?')}</span><h1>${esc(m.name)}</h1><p>${esc(m.real||'Member Profile')}</p>`;document.querySelector('.member-photo-large').innerHTML=m.photo?`<img src="${m.photo}" alt="">`:'<span>✦</span>'}go();clearInterval(timer);timer=setInterval(go,4200)}document.getElementById('tabs').innerHTML=['ALL',...new Set(data().map(x=>String(x.gen)).filter(Boolean))].map(x=>`<a href="#" data-gen="${esc(x)}">${x==='ALL'?'ALL':'GEN '+x}</a>`).join('');document.getElementById('tabs').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();gen=a.dataset.gen;render()});render();hero()})();</script></body></html>
