const key='edn',group='EDN48'; const data=WTS.get('wts_members',WTS.seed); const members=data[key]||[]; const hero=document.getElementById('memberHero');

const gens=[...new Set(members.map(m=>m.gen))]; document.getElementById('memberList').innerHTML=gens.map(g=>`<div class="gen-title"><h2>${g}</h2><span class="badge">${members.filter(m=>m.gen===g).length} MEMBERS</span></div><div class="member-grid">${members.filter(m=>m.gen===g).map(m=>`<article class="member-card"><div class="member-thumb">${m.image?`<img src="${m.image}">`:'✦'}</div><div class="inside"><h3>${m.name} ${m.kami?`<span class="kami">★ ${m.kami}</span>`:''}</h3><small>ชื่อจริง: ${m.real||'—'}</small><small>อายุ: ${m.age||'—'}</small><small>${m.bio||''}</small><a href="artist.html?group=${key}&member=${encodeURIComponent(m.name)}">ดูโปรไฟล์ →</a></div></article>`).join('')}</div>`).join('');
</script></body></html>
