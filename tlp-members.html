<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLP48 Members</title><link rel="stylesheet" href="style.css"></head><body><main class="app tlp"><header class="top"><a href="tlp48.html">‹</a><div class="brand">TLP48 MEMBERS</div><a href="admin.html">⚙</a></header><section class="section"><div class="member-banner"><div id="bannerText" class="member-banner-text"></div></div><div class="member-tabs"><a class="active" href="#all">ALL</a><a href="#g1">GEN 1</a><a href="#g2">GEN 2</a><a href="#g3">GEN 3</a><a href="#g4">GEN 4</a><a href="#g5">GEN 5</a><a href="#g6">GEN 6</a></div><h2 class="section-title">ALL MEMBERS <small id="memberCount" style="font-size:12px;color:#999;margin-left:auto">0 Members</small></h2><div id="membersRoot"></div></section></main><nav class="bottom"><a href="tlp48.html"><span>⌂</span>Home</a><a href="tlp-members.html"><span>☷</span>Members</a><a href="tlp-music.html"><span>♫</span>Music</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>const K="wts_members_v1";function data(g){return (JSON.parse(localStorage.getItem(K)||"{}")[g]||[])}function esc(s){return String(s||"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[x]))}let all=[];function render(g,gen="all"){all=data(g);let a=gen==="all"?all:all.filter(m=>String(m.gen)===String(gen)),r=document.getElementById("membersRoot");document.getElementById("memberCount").textContent=a.length+" Members";r.innerHTML=a.length?"<div class=member-grid>"+a.map(m=>`<article class=member-card><div class=member-photo>${m.photo?`<img src="${m.photo}" alt="">`:"PHOTO"}</div><div class=member-info><b>${esc(m.name)}</b><small>Generation ${esc(m.gen)}${m.age?" • "+esc(m.age)+" ปี":""}</small><small>${esc(m.real)}</small></div></article>`).join("")+"</div>":'<div class=member-empty>ยังไม่มีสมาชิกในรุ่นนี้<br><small>แอดมินเพิ่มสมาชิกได้จาก ADMIN PANEL</small></div>'}function rotate(g){let a=data(g),b=document.getElementById("bannerText");if(!a.length){b.innerHTML=`<span class=eyebrow>MEMBERS</span><h1>${g} MEMBERS</h1><p>เพิ่มสมาชิกจาก ADMIN PANEL</p>`;return}let i=0;function go(){let m=a[i++%a.length];b.innerHTML=`${m.photo?`<img src="${m.photo}" style="position:absolute;right:18px;top:18px;width:125px;height:125px;object-fit:cover;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,.15)">`:''}<span class=eyebrow>GENERATION ${esc(m.gen)}</span><h1>${esc(m.name)}</h1><p>${esc(m.real||"Member Profile")}</p>`}go();setInterval(go,4000)}document.querySelectorAll('.member-tabs a').forEach((a,i)=>a.addEventListener('click',()=>{document.querySelectorAll('.member-tabs a').forEach(x=>x.classList.remove('active'));a.classList.add('active');render("TLP48",i===0?'all':String(i))}));render("TLP48");rotate("TLP48");</script><script src="wts-app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const d=WTS.load(),a=d.members.filter(m=>m.group==='TLP48');if(!a.length)return;const root=document.querySelector('.cards')||document.querySelector('.member-grid')||document.querySelector('.section');if(!root)return;const box=document.createElement('div');box.className='cards';box.innerHTML=a.map(m=>`<a class="card member-admin-card" href="member.html?id=${encodeURIComponent(m.id)}"><div class="profile-avatar small">${m.avatar?`<img src="${m.avatar}">`:'●'}</div><b>${WTS.esc(m.name)}</b><p>${m.group} · Gen ${m.gen||'-'}</p></a>`).join('');root.appendChild(box)})</script></body></html>
