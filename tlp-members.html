<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLP48 Members</title><link rel="stylesheet" href="style.css"></head><body><main class="app tlp"><header class="top"><a href="tlp48.html">‹</a><div class="brand">TLP48 MEMBERS</div><a href="admin.html">⚙</a></header><section class="section"><div class="member-banner"><div id="bannerText" class="member-banner-text"></div></div><div class="member-tabs"><a class="active" data-gen="all">ALL</a><a data-gen="1">GEN 1</a><a data-gen="2">GEN 2</a><a data-gen="3">GEN 3</a><a data-gen="4">GEN 4</a><a data-gen="5">GEN 5</a><a data-gen="6">GEN 6</a></div><h2 class="section-title">ALL MEMBERS <small id="memberCount" style="font-size:12px;color:#999;margin-left:auto">0 Members</small></h2><div id="membersRoot"></div></section></main><nav class="bottom"><a href="tlp48.html"><span>⌂</span>Home</a><a href="edn-members.html"><span>☷</span>Members</a><a href="edn-music.html"><span>♫</span>Music</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="wts-cloud.js"></script><script src="site-brand.js"></script><script>
const esc=WTSCloud.esc;let all=[];function render(gen='all'){const a=gen==='all'?all:all.filter(m=>String(m.generation)===String(gen));memberCount.textContent=a.length+' Members';membersRoot.innerHTML=a.length?`<div class="member-grid">${a.map(m=>`<article class="member-card" onclick="location.href='account.html?member=${encodeURIComponent(m.username)}'"><div class="member-photo">${m.avatar_url?`<img src="${esc(m.avatar_url)}" alt="">`:'PHOTO'}</div><div class="member-info"><b>${esc(m.display_name)}</b><small>Generation ${m.generation||'-'}${m.age?' • '+m.age+' ปี':''}</small><small>${esc(m.real_name||'')}</small></div></article>`).join('')}</div>`:'<div class="member-empty">ยังไม่มีสมาชิกในรุ่นนี้<br><small>แอดมินเพิ่มสมาชิกได้จาก ADMIN PANEL</small></div>'}function rotate(){const b=document.getElementById('bannerText');if(!all.length){b.innerHTML='<span class="eyebrow">MEMBERS</span><h1>TLP48 MEMBERS</h1><p>เพิ่มสมาชิกจาก ADMIN PANEL</p>';return}let i=0;const go=()=>{const m=all[i++%all.length];b.innerHTML=`${m.avatar_url?`<img src="${esc(m.avatar_url)}" style="position:absolute;right:18px;top:18px;width:125px;height:125px;object-fit:cover;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,.15)">`:''}<span class="eyebrow">GENERATION ${m.generation||'-'}</span><h1>${esc(m.display_name)}</h1><p>${esc(m.real_name||'Member Profile')}</p>`};go();setInterval(go,4000)}(async()=>{try{all=await WTSCloud.members('TLP48');render();rotate()}catch(e){membersRoot.innerHTML='<div class="member-empty">เชื่อมต่อระบบสมาชิกไม่สำเร็จ</div>'}})();document.querySelectorAll('.member-tabs a').forEach(a=>a.onclick=()=>{document.querySelectorAll('.member-tabs a').forEach(x=>x.classList.remove('active'));a.classList.add('active');render(a.dataset.gen)});
</script></body></html>
