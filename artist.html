<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Profile • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app"><header class="top"><a href="javascript:history.back()">‹</a><div class="brand">MEMBER PROFILE</div></header><div id="profile"></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="tlp-members.html"><span>☷</span>Members</a><a href="spark.html"><span>★</span>Spark</a><a href="major-vote.html"><span>♛</span>Major</a><a href="account.html"><span>●</span>Account</a></nav><script>const q=new URLSearchParams(location.search),key=q.get('group')||'tlp',name=q.get('member')||'',all=WTS.get('wts_members',WTS.seed)[key]||[],m=all.find(x=>x.name===name)||all[0];document.getElementById('profile').innerHTML=m?`<div class="profile-head"><div class="profile-avatar">${m.image?`<img src="${m.image}">`:'✦'}</div><h1>${m.name} ${m.kami?`<span class="kami">★ ${m.kami}</span>`:''}</h1><div>${m.gen}</div></div><section class="section"><div class="card"><h3>PROFILE</h3><p><b>ชื่อจริง:</b> ${m.real||'—'}</p><p><b>อายุ:</b> ${m.age||'—'}</p><p><b>ข้อมูล:</b> ${m.bio||'—'}</p><button class="primary" onclick="oshi()">♥ Oshi Member</button></div></section>`:'<div class="section"><div class="card">ไม่พบสมาชิก</div></div>';function oshi(){let a=WTS.get('wts_oshi',[]);if(!a.some(x=>x.name===m.name)){a.push({name:m.name,kami:m.kami||''});WTS.set('wts_oshi',a);alert('เพิ่ม Oshi แล้ว')}else alert('มีสมาชิกนี้ใน Oshi List แล้ว')}</script></body></html>
