<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="account.html">‹</a><div class="brand">INVENTORY</div></header><section class="section"><div id="root" class="inventory-grid"></div></section></main><script src="app.js"></script><script>const u=WTS.current();root.innerHTML=u?.inventory?.length?u.inventory.map(x=>`<article class="inventory-item"><div>${x.image?`<img src="${x.image}">`:'🎁'}</div><b>${WTS.escapeHtml(x.name)}</b><small>Received ${new Date(x.receivedAt).toLocaleDateString('th-TH')}</small></article>`).join(''):'<div class="empty-post">Inventory ยังว่าง</div>'</script></body></html>
