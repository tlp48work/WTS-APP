<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLP48 Works</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app tlp"><header class="top glass"><a href="tlp48.html">‹</a><div class="brand">TLP48 WORKS</div><a href="account.html">●</a></header><section class="section"><div class="works-hero"><span class="eyebrow">TLP48 • LATEST WORKS</span><h1>Moments worth keeping.</h1><p>ผลงานล่าสุดของ TLP48 อัปเดตโดย Admin</p></div><div id="works" class="work-grid large"></div><div id="schedule" class="schedule"></div></section></main><nav class="bottom"><a href="tlp48.html"><span>⌂</span>Home</a><a href="tlp-members.html"><span>☷</span>Members</a><a href="tlp-club.html"><span>✿</span>Club</a><a href="tlp-music.html"><span>♫</span>Music</a><a href="account.html"><span>●</span>Account</a></nav><script>
(()=>{const g='TLP48',K=WTS.K,read=WTS.read,esc=WTS.esc;const w=read(K.works,{})[g]||[];document.getElementById('works').innerHTML=w.map(x=>`<article class="work-card large" style="${x.image?`background-image:linear-gradient(180deg,transparent,rgba(0,0,0,.78)),url('${x.image}')`:''}"><div><small>${esc(x.type||'WORK')}</small><b>${esc(x.title)}</b><span>${esc(x.date||'')}</span></div></article>`).join('')||'<div class="empty-card">ยังไม่มีผลงาน</div>';const s=read(K.schedule,{})[g]||[];document.getElementById('schedule').innerHTML=`<h2>UPCOMING SCHEDULE</h2>`+s.map(x=>`<div class="event"><b>${esc(x.date)} · ${esc(x.time)}</b><span>${esc(x.title)}</span></div>`).join('')})();</script></body></html>
