<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPARK OF THE MONTH</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app spark-page"><header class="top glass"><a href="index.html">⌂</a><div class="brand">SPARK OF THE MONTH</div><a class="star-pill" href="account.html">⭐ <span id="star">0</span></a></header><section class="spark-hero"><div class="spark-big">✦</div><div><span class="eyebrow">EDN48 × TLP48</span><h1>SPARK OF THE MONTH</h1><p>ส่ง STAR ให้สมาชิกที่ทำให้เดือนนี้พิเศษขึ้น</p></div></section><section class="section"><div class="section-head"><div><span class="eyebrow soft">THIS MONTH</span><h2>SPARK MEMBERS</h2></div></div><div id="sparkList" class="spark-list"></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a class="active" href="spark.html"><span>★</span>Spark</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>
(()=>{const K=WTS.K,read=WTS.read,write=WTS.write,session=WTS.session,change=WTS.changeBalance,fmt=WTS.fmt,esc=WTS.esc;function members(){let d=read(K.spark,{votes:{},members:[]});if(d.members.length)return d.members;return [...(read(K.members,{}).EDN48||[]),...(read(K.members,{}).TLP48||[])].map((m,i)=>({id:m.id||'m'+i,name:m.name,group:i%2?'TLP48':'EDN48',photo:m.photo||''}))}function draw(){const d=read(K.spark,{votes:{},members:[]}),a=members();document.getElementById('star').textContent=fmt(session()?.star||0);document.getElementById('sparkList').innerHTML=a.map(m=>`<article class="spark-row">${m.photo?`<img src="${m.photo}">`:'<div class="spark-avatar">✦</div>'}<div><b>${esc(m.name||'NAME')}</b><small>${esc(m.group)}</small><span>⭐ ${fmt(d.votes[m.id]||0)} STAR</span></div><button data-id="${esc(m.id)}">SEND STAR</button></article>`).join('')||'<div class="empty-card">เพิ่มสมาชิกเพื่อเริ่ม Spark</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>send(b.dataset.id))}function send(id){const s=session();if(!s)return location.href='login.html?return=spark.html';let n=prompt('จำนวน STAR ที่ต้องการส่ง','1');n=Math.floor(Number(n));if(!Number.isFinite(n)||n<1)return;if(Number(s.star||0)<n)return alert('STAR ไม่พอ');change('star',-n);let d=read(K.spark,{votes:{},members:[]});d.votes[id]=Number(d.votes[id]||0)+n;write(K.spark,d);draw()}draw()})();</script></body></html>
