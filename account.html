<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="wts-app.js"></script></head><body><main class="app" id="accountApp"><header class="top"><a href="javascript:history.back()">‹</a><div class="brand">ACCOUNT</div><button class="icon-btn" onclick="logout()">↪</button></header><div id="account"></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="shop.html"><span>♜</span>Shop</a><a href="major-vote.html"><span>▣</span>Vote</a><a class="active" href="account.html"><span>●</span>Account</a></nav><script>
function logout(){WTS.setUser(null);location.href='index.html'}
function render(){const u=WTS.user();if(!u){location.href='login.html?return=account.html';return}const d=WTS.load();if(u.role==='member'){const m=d.members.find(x=>x.id===u.memberId);if(!m)return;document.getElementById('account').innerHTML=`<section class="member-profile-page"><div class="cover-edit" style="background-image:${m.cover?`url(${m.cover})`:''}"><button onclick="pick('cover')">✎ Edit</button></div><div class="member-profile-main"><div class="profile-avatar big">${m.avatar?`<img src="${m.avatar}">`:'●'}</div><button class="edit-avatar" onclick="pick('avatar')">📷</button><h1>${WTS.esc(m.name)}</h1><p class="member-dot">${WTS.esc(m.group)} · MEMBER</p><div class="profile-actions"><button onclick="pick('avatar')">📷 Profile</button><button onclick="pick('cover')">🖼 Cover</button><button onclick="document.getElementById('postText').focus()">✦ Post</button></div></div></section><section class="section"><div class="member-account-title"><div><h2>MY ACCOUNT</h2><span>${WTS.esc(m.name)}</span></div><span class="member-badge">MEMBER</span></div><form data-post-form class="post-composer"><div class="composer-head"><div class="profile-avatar small">${m.avatar?`<img src="${m.avatar}">`:'●'}</div><b data-post-name>${WTS.esc(m.name)}</b></div><textarea id="postText" placeholder="วันนี้อยากบอกอะไรกับแฟน ๆ ?"></textarea><div class="composer-actions"><label class="file-btn">＋ รูปภาพ<input type="file" accept="image/*"></label><button class="primary">POST</button></div></form><h2 class="section-title">MY POSTS</h2><div data-timeline="${m.group}" class="timeline"></div></section>`;}
else{const f=d.fans.find(x=>x.id===u.id);if(!f)return;const kami=f.oshi?.[0]||'—';document.getElementById('account').innerHTML=`<section class="fan-profile-page"><div class="cover-edit fan-cover" style="background-image:${f.cover?`url(${f.cover})`:''}"><button onclick="pick('cover')">✎ Edit</button></div><div class="fan-profile-main"><div class="profile-avatar big">${f.avatar?`<img src="${f.avatar}">`:'●'}</div><button class="edit-avatar" onclick="pick('avatar')">📷 Edit</button><h1>${WTS.esc(f.name)}</h1><p class="fan-kami">${kami!=='—'?`♛ ${WTS.esc(kami)} · Kami-Oshi`:'Choose your Oshi'}</p><div class="fan-stats"><div><b>${f.oshi.length}</b><small>OSHI</small></div><div><b>${WTS.fmt(f.star)}</b><small>STARS</small></div><div><b>${WTS.fmt(f.token)}</b><small>TOKEN</small></div><div><b>${f.inventory.length}</b><small>ITEMS</small></div></div><div class="profile-actions"><button onclick="editOshi()">♡ Oshi List</button><a href="shop.html">🛍 Shop</a><a href="major-vote.html">▣ Vote</a></div></div></section><section class="section account-menu"><h2 class="section-title">MY ACCOUNT</h2><div class="account-panel"><div class="balance-line"><span>⭐ STAR</span><b>${WTS.fmt(f.star)}</b></div><div class="balance-line"><span>🪙 TOKEN</span><b>${WTS.fmt(f.token)}</b></div><a href="shop.html">🎁 Inventory <b>${f.inventory.length}</b> ›</a><a href="spark.html">⭐ SPARK OF THE MONTH ›</a><button onclick="editProfile()">✎ Edit Profile</button><button class="danger" onclick="logout()">Logout</button></div><h2 class="section-title">OSHI LIST</h2><div class="oshi-list">${f.oshi.length?f.oshi.map((x,i)=>`<div><span>${i===0?'♛':'♡'}</span><b>${WTS.esc(x)}${i===0?' · Kami-Oshi':''}</b></div>`).join(''):'<div class="empty-small">ยังไม่มี Oshi</div>'}</div></section>`}}
function pick(type){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>WTS.fileData(input.files[0],data=>{const u=WTS.user(),d=WTS.load();if(u.role==='member'){const m=d.members.find(x=>x.id===u.memberId);m[type]=data}else{const f=d.fans.find(x=>x.id===u.id);f[type]=data}WTS.save(d);render()});input.click()}
function editProfile(){const u=WTS.user(),d=WTS.load();const f=d.fans.find(x=>x.id===u.id);const n=prompt('ชื่อที่แสดง',f.name);if(n){f.name=n;WTS.setUser({...u,name:n});WTS.save(d);render()}}
function editOshi(){const u=WTS.user(),d=WTS.load(),f=d.fans.find(x=>x.id===u.id);const name=prompt('ใส่ชื่อ Oshi\nถ้าต้องการหลายคนคั่นด้วย ,',f.oshi.join(', '));if(name!==null){f.oshi=name.split(',').map(x=>x.trim()).filter(Boolean);WTS.save(d);render()}}
document.addEventListener('DOMContentLoaded',render);
</script></body></html>
