<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body class="account-page"><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">MY ACCOUNT</div><button class="icon-btn" onclick="logout()">↪</button></header><div id="accountRoot"></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="shop.html"><span>▣</span>Shop</a><a href="account.html" class="active"><span>●</span>Account</a></nav><script src="app.js"></script><script>
function fileData(input,cb){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function drawAccount(){const root=document.getElementById('accountRoot'),u=WTS.current();if(!u){root.innerHTML=`<section class="account-login-card"><div class="account-logo">✦</div><h1>MY ACCOUNT</h1><p>เข้าสู่ระบบเพื่อจัดการบัญชีของคุณ</p><a class="primary wide" href="login.html?return=account.html">LOGIN</a></section>`;return}
 const member=u.role==='member'; const cover=u.cover||''; const inv=u.inventory||[];
 root.innerHTML=`<section class="profile-cover ${cover?'has-image':''}" ${cover?`style="background-image:url('${cover}')"`:''}><button class="edit-cover" onclick="document.getElementById('coverFile').click()">▣ Edit</button><input id="coverFile" type="file" accept="image/*" hidden></section><section class="profile-main"><div class="profile-avatar account-avatar">${u.avatar?`<img src="${u.avatar}">`:'○'}<button class="avatar-edit" onclick="document.getElementById('avatarFile').click()">▣ Edit</button><input id="avatarFile" type="file" accept="image/*" hidden></div><h1>${WTS.escapeHtml(u.name)}</h1><p class="account-group">${WTS.escapeHtml(u.group||'WAY TO SHINE')} ${member?'<span class="role-pill member">MEMBER</span>':'<span class="role-pill fan">FAN</span>'}</p>
 ${member?`<div class="member-account-note">Member Account<br><small>บัญชีสมาชิกสามารถโพสต์ลง Timeline ได้</small></div>`:`<div class="fan-stats"><div><b>${u.oshiList?.length||0}</b><span>Oshi List</span></div><div><b>${WTS.fmt(u.stars)}</b><span>Stars</span></div><div><b>${WTS.fmt(u.token)}</b><span>Token</span></div></div>`}</section>
 ${member?`<section class="account-section"><div class="section-heading"><h2>PROFILE</h2><button class="small-btn" onclick="editProfile()">Edit</button></div><div class="profile-info-card"><b>${WTS.escapeHtml(u.name)}</b><span>${WTS.escapeHtml(u.group)}</span><small>Member profile • Timeline enabled</small></div></section><section class="account-section"><div class="section-heading"><h2>MY POSTS</h2></div><div id="myPosts"></div></section>`:`<section class="account-section"><div class="section-heading"><h2>MY ACCOUNT</h2></div><div class="account-menu"><div class="account-menu-row"><span>♛</span><div><b>Oshi List</b><small>${(u.oshiList||[]).length?u.oshiList.map(x=>WTS.escapeHtml(x.name||x)).join(', '):'ยังไม่มี Oshi'}</small></div><button onclick="editOshi()">Edit</button></div><div class="account-menu-row"><span>👑</span><div><b>Kami-Oshi</b><small>${u.kamiOshi?WTS.escapeHtml(u.kamiOshi):'ยังไม่ได้เลือก'}</small></div><button onclick="editKami()">Edit</button></div><div class="account-menu-row"><span>⭐</span><div><b>Stars</b><small>${WTS.fmt(u.stars)}</small></div><a href="shop.html">Buy</a></div><div class="account-menu-row"><span>🪙</span><div><b>Token</b><small>${WTS.fmt(u.token)}</small></div><a href="shop.html">Shop</a></div><div class="account-menu-row"><span>🎒</span><div><b>Inventory</b><small>${inv.length} items</small></div><a href="inventory.html">Open</a></div></div></section>`}
 root.querySelector('#avatarFile')?.addEventListener('change',e=>fileData(e.target,data=>{u.avatar=data;WTS.saveUser(u);drawAccount()}));root.querySelector('#coverFile')?.addEventListener('change',e=>fileData(e.target,data=>{u.cover=data;WTS.saveUser(u);drawAccount()}));if(member){const p=WTS.read(WTS.posts,[]).filter(x=>x.author===u.username);document.getElementById('myPosts').innerHTML=p.length?p.map(x=>`<div class="mini-post"><small>${new Date(x.createdAt).toLocaleString('th-TH')}</small><b>${WTS.escapeHtml(x.text)}</b></div>`).join(''):'<div class="empty-post">ยังไม่มีโพสต์</div>'}}
function editProfile(){const u=WTS.current();const n=prompt('ชื่อที่แสดง',u.name);if(n){u.name=n;WTS.saveUser(u);drawAccount()}}
function editKami(){const u=WTS.current();const k=prompt('ชื่อสมาชิกที่เป็น Kami-Oshi',u.kamiOshi||'');if(k!==null){u.kamiOshi=k;WTS.saveUser(u);drawAccount()}}
function editOshi(){const u=WTS.current();const x=prompt('ใส่ Oshi คั่นด้วยเครื่องหมาย ,', (u.oshiList||[]).map(a=>a.name||a).join(', '));if(x!==null){u.oshiList=x.split(',').map(s=>({name:s.trim()})).filter(a=>a.name);WTS.saveUser(u);drawAccount()}}
drawAccount();</script></body></html>
