<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">MY ACCOUNT</div><div class="icons"><a href="admin.html" style="text-decoration:none;color:inherit">⚙</a></div></header><section class="profile-head"><div class="profile-avatar">●</div><h1 id="username">USER</h1><div id="email" style="color:#d783a4">MEMBER</div></section><section class="stat-grid"><div class="stat"><b id="stars">100</b><small>⭐ Stars</small></div><div class="stat"><b id="token">10</b><small>🪙 Token</small></div><div class="stat"><b id="major">5</b><small>💎 Major Vote Token</small></div><div class="stat"><b id="oshiCount">0</b><small>♥ Oshi Members</small></div><div class="stat"><b id="inventory">0</b><small>🎒 Inventory</small></div><div class="stat"><b id="kami">—</b><small>👑 Kami-Oshi</small></div></section><section class="section"><h2 class="section-title">MY OSHI LIST</h2><div class="card" id="oshiList">ยังไม่มีสมาชิกที่กด Oshi</div></section><div class="account-list"><a class="account-row" href="tlp-members.html">🌷 TLP48 Members <span>›</span></a><a class="account-row" href="edn-members.html">💜 EDN48 Members <span>›</span></a><a class="account-row" href="major-vote.html">♛ Major Vote <span>›</span></a><a class="account-row" href="admin.html">⚙ Admin Panel <span>›</span></a><a class="account-row" href="#" onclick="logout();return false">↪ Logout <span>›</span></a></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="tlp-members.html"><span>☷</span>Members</a><a href="spark.html"><span>★</span>Spark</a><a href="major-vote.html"><span>♛</span>Major</a><a href="account.html"><span>●</span>Account</a></nav><script>document.getElementById('username').textContent=localStorage.getItem('wts_user')||'USER';document.getElementById('email').textContent=localStorage.getItem('wts_email')||'MEMBER';document.getElementById('stars').textContent=localStorage.getItem('wts_stars')||100;document.getElementById('token').textContent=localStorage.getItem('wts_token')||10;document.getElementById('major').textContent=localStorage.getItem('wts_major')||5;const o=WTS.get('wts_oshi',[]);document.getElementById('oshiCount').textContent=o.length;document.getElementById('oshiList').innerHTML=o.length?o.map(x=>`<div class="account-row">♥ ${x.name} ${x.kami?`<span class="badge">👑 ${x.kami}</span>`:''}</div>`).join(''):'ยังไม่มีสมาชิกที่กด Oshi';document.getElementById('kami').textContent=o.find(x=>x.kami)?.name||'—';document.getElementById('inventory').textContent=Object.keys(localStorage).filter(k=>k.includes('wts_unlock_')).length;function logout(){localStorage.removeItem('wts_user');localStorage.removeItem('wts_email');location.href='index.html'}</script></body></html>
