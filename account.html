<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app account-page"><header class="top account-top"><a href="javascript:history.back()">‹</a><div class="brand">MY ACCOUNT</div><a href="login.html">↪</a></header><div id="accountRoot"></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html" class="active"><span>●</span>Account</a></nav><script>
const MEMBER_KEY='wts_member_accounts_v1', FAN_KEY='wts_fan_accounts_v1', SESSION='wts_session_v2', OLD='wts_member_session';
const root=document.getElementById('accountRoot');
function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function session(){try{let s=get(SESSION,null);if(s)return s}catch{} const u=localStorage.getItem(OLD); if(u){const a=get(MEMBER_KEY,[]).find(x=>x.username===u);if(a)return {role:'member',username:a.username}} return null}
function accountsFor(s){return s.role==='member'?get(MEMBER_KEY,[]):get(FAN_KEY,[])}
function current(){const s=session(); if(!s)return null; return accountsFor(s).find(x=>x.username===s.username)||null}
function avatarStyle(url, fallback){return url?`style="background-image:url('${encodeURI(url).replace(/'/g,'%27')}')"`:`>${fallback}`}
function fmt(n){return Number(n||0).toLocaleString('en-US')}
function initials(n){return (String(n||'U').trim()[0]||'U').toUpperCase()}
function posts(){return get('wts_timeline_v1',[])}
function memberPosts(me){return posts().filter(p=>p.authorUsername===me.username).sort((a,b)=>b.createdAt-a.createdAt)}
function postCard(p){return `<article class="member-post-card"><div class="member-post-head"><div class="account-mini-avatar" ${p.photo?`style="background-image:url('${encodeURI(p.photo).replace(/'/g,'%27')}')"`:''}>${p.photo?'':esc(initials(p.name))}</div><div><b>${esc(p.name)}</b><small>${new Intl.DateTimeFormat('th-TH',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(p.createdAt))}</small></div></div>${p.text?`<div class="member-post-text">${esc(p.text).replace(/\n/g,'<br>')}</div>`:''}${p.media?(/\.(mp4|webm|ogg)(\?|#|$)/i.test(p.media)?`<video controls playsinline class="member-post-media" src="${esc(p.media)}"></video>`:`<img class="member-post-media" src="${esc(p.media)}" alt="Post" loading="lazy">`):''}<div class="member-post-stats">⭐ ${fmt(p.stars)} STAR <span>♡ ${fmt(p.comments)} Comments</span></div></article>`}
function render(){const s=session(), me=current(); if(!s||!me){root.innerHTML=`<section class="account-empty"><div class="account-empty-icon">●</div><h1>MY ACCOUNT</h1><p>เข้าสู่ระบบเพื่อดูบัญชีของคุณ</p><a class="primary account-login-btn" href="login.html?return=account.html">LOGIN</a><a class="account-register" href="register.html">สมัครแฟนคลับ</a></section>`;return}
 const isMember=s.role==='member'; const mine=isMember?memberPosts(me):[]; const star=isMember?Number(me.star||0):Number(me.star??100); const token=Number(me.token??10); const major=Number(me.major||0); const like=Number(me.likes||0); const cover=me.cover||'';
 root.innerHTML=`<section class="member-profile-shell ${isMember?'is-member':'is-fan'} ${me.group==='TLP48'?'theme-tlp':'theme-edn'}"><div class="profile-cover" ${cover?`style="background-image:url('${encodeURI(cover).replace(/'/g,'%27')}')"`:''}><button class="cover-edit" id="coverEdit" type="button">✎</button></div><div class="profile-main"><div class="profile-avatar-wrap"><div class="profile-avatar" id="profileAvatar" ${me.photo?`style="background-image:url('${encodeURI(me.photo).replace(/'/g,'%27')}')"`:''}>${me.photo?'':esc(initials(me.name))}</div><label class="profile-avatar-edit" title="เปลี่ยนรูปโปรไฟล์">＋<input id="avatarFile" type="file" accept="image/*" hidden></label></div><div class="kami-badge">${isMember?'MEMBER':'FAN'}</div><h1>${esc(me.name)}</h1><p class="profile-handle">${isMember?esc(me.group||'')+' • @'+esc(me.username):'@'+esc(me.username)}</p><div class="profile-stats"><div><b>${fmt(me.oshiCount||0)}</b><small>Oshi</small></div><div><b>${fmt(me.kamiCount||0)}</b><small>Kami-Oshi</small></div><div><b>${fmt(star)}</b><small>STAR</small></div><div><b>${fmt(like)}</b><small>Like</small></div></div><div class="profile-actions"><button class="profile-action primary-action" id="starBtn">⭐<span>STAR</span></button></div><div class="profile-tools"><button id="editProfileBtn">✎ Edit Profile</button><button id="logoutBtn">↪ Logout</button></div></div></section>
 <section class="account-balance"><div><b>${fmt(star)}</b><small>STAR</small></div><div><b>${fmt(token)}</b><small>TOKEN</small></div><div><b>${fmt(major)}</b><small>MAJOR VOTE</small></div></section>
 <section class="member-feed-section"><div class="member-feed-title"><div><span>${isMember?'MEMBER':'FAN'} TIMELINE</span><h2>${isMember?'Posts by '+esc(me.name):'My Timeline'}</h2></div>${isMember?'<a href="'+(me.group==='TLP48'?'tlp48.html':'edn48.html')+'#timeline">View Timeline ›</a>':''}</div>${isMember?(mine.length?mine.map(postCard).join(''):`<div class="member-no-post"><b>ยังไม่มีโพสต์</b><small>โพสต์ของสมาชิกจะแสดงตรงนี้เมื่อคุณลงใน Timeline</small></div>`):`<div class="member-no-post"><b>บัญชีแฟนคลับ</b><small>สามารถเปลี่ยนรูปโปรไฟล์และข้อมูลบัญชีได้จาก Edit Profile</small></div>`}</section>
 <section class="profile-edit-panel" id="editPanel" hidden><h2>EDIT PROFILE</h2><div class="field"><label>Display Name</label><input id="editName" value="${esc(me.name)}"></div><div class="field"><label>Profile Photo URL</label><input id="editPhoto" value="${esc(me.photo||'')}" placeholder="https://..."></div><div class="field"><label>Cover Photo URL</label><input id="editCover" value="${esc(me.cover||'')}" placeholder="https://..."></div><div class="file-hint">หรือเลือกรูปจากเครื่องได้โดยกดปุ่ม + ที่รูปโปรไฟล์</div><button class="primary" id="saveProfile">SAVE PROFILE</button></section>`;
 document.getElementById('avatarFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const d=accountsFor(s);const a=d.find(x=>x.username===me.username);a.photo=r.result;save(s.role==='member'?MEMBER_KEY:FAN_KEY,d);render()};r.readAsDataURL(f)};
 document.getElementById('coverEdit').onclick=()=>document.getElementById('editPanel').hidden=false;
 document.getElementById('editProfileBtn').onclick=()=>document.getElementById('editPanel').hidden=!document.getElementById('editPanel').hidden;
 document.getElementById('saveProfile').onclick=()=>{const d=accountsFor(s),a=d.find(x=>x.username===me.username);a.name=document.getElementById('editName').value.trim()||a.name;a.photo=document.getElementById('editPhoto').value.trim()||a.photo||'';a.cover=document.getElementById('editCover').value.trim()||a.cover||'';save(s.role==='member'?MEMBER_KEY:FAN_KEY,d);render()};
 document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem(SESSION);localStorage.removeItem(OLD);localStorage.removeItem('wts_logged');location.href='login.html'};
 document.getElementById('starBtn').onclick=()=>{let d=accountsFor(s),a=d.find(x=>x.username===me.username);a.star=Number(a.star||0)+1;save(s.role==='member'?MEMBER_KEY:FAN_KEY,d);render()};
}
render();
</script></body></html>
