<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app account-page"><header class="top glass"><a href="index.html">⌂</a><div class="brand" id="title">MY ACCOUNT</div><a href="admin.html">⚙</a></header><div id="notLogged" class="account-login"><div class="account-icon">✦</div><h1>YOUR LITTLE SPACE</h1><p>เข้าสู่ระบบเพื่อดู Oshi List, STAR, TOKEN, Inventory และโพสต์ของสมาชิก</p><a class="primary" href="login.html?return=account.html">LOGIN</a><a class="soft-btn" href="register.html">CREATE FAN ACCOUNT</a></div><section id="account" style="display:none"><div class="profile-cover" id="cover"><button id="coverBtn">✦</button></div><div class="profile-wrap"><div class="avatar-wrap"><div id="avatar" class="profile-avatar">W</div><button id="avatarBtn">✎</button></div><span id="role" class="role-badge"></span><h1 id="name">NAME</h1><p id="sub">WAY TO SHINE</p><div id="fanStats" class="account-stats"></div><div id="memberHint" class="member-hint"></div><div class="account-actions"><button id="edit">EDIT PROFILE</button><button id="logout">LOG OUT</button></div></div><div class="section account-section"><div id="fanExtras"></div><div class="section-head"><div><span class="eyebrow soft">SOCIAL</span><h2>Timeline</h2></div></div><div class="timeline" id="timeline"></div></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="major-vote.html"><span>▣</span>Vote</a><a class="active" href="account.html"><span>●</span>Account</a></nav><div id="modal" class="modal"><div class="modal-card"><button class="modal-close" id="close">×</button><h2>Edit Profile</h2><p>รูปโปรไฟล์และ Cover เปลี่ยนได้จากตรงนี้</p><label>Display Name<input id="editName"></label><label>Profile Photo<input id="photoFile" type="file" accept="image/*"></label><label>Cover Photo<input id="coverFile" type="file" accept="image/*"></label><button class="primary" id="save">SAVE PROFILE</button></div></div><script src="timeline.js"></script><script>
(()=>{const K=WTS.K,read=WTS.read,write=WTS.write,session=WTS.session,fileData=WTS.fileData,esc=WTS.esc,fmt=WTS.fmt;function profile(){const s=session();if(!s)return null;let p=s.profile||{};return {...s,photo:p.photo||s.photo||'',cover:p.cover||s.cover||'',display:p.name||s.name||s.username}}function draw(){const s=profile();if(!s){document.getElementById('notLogged').style.display='block';return}document.getElementById('notLogged').style.display='none';document.getElementById('account').style.display='block';const member=s.type==='member';document.getElementById('title').textContent=member?'MEMBER ACCOUNT':'MY ACCOUNT';document.getElementById('role').textContent=member?`${s.group||'48 FAMILY'} MEMBER`:'FAN ACCOUNT';document.getElementById('name').textContent=s.display;document.getElementById('sub').textContent=member?`${s.group||'WAY TO SHINE'} • MEMBER`:'WAY TO SHINE FAN';const av=document.getElementById('avatar');av.textContent=s.photo?'':s.display.slice(0,1).toUpperCase();av.style.backgroundImage=s.photo?`url('${s.photo}')`:'';document.getElementById('cover').style.backgroundImage=s.cover?`linear-gradient(180deg,rgba(30,20,40,.1),rgba(30,20,40,.2)),url('${s.cover}')`:'';document.getElementById('fanStats').innerHTML=member?'':`<div><b>${fmt(s.oshiList?.length||0)}</b><small>Oshi List</small></div><div><b>${fmt(s.star||0)}</b><small>STAR</small></div><div><b>${fmt(s.token||0)}</b><small>TOKEN</small></div><div><b>${read(K.inventory,[]).filter(x=>x.username===s.username).length}</b><small>Inventory</small></div>`;document.getElementById('memberHint').innerHTML=member?`<div class="member-account-note">Member account mode · แก้รูปและโพสต์ Timeline ได้เลย<br><small>ไม่มี Kami-Oshi และไม่มีตัวเลขสะสมบนหน้า Member Account</small></div>`:'';document.getElementById('fanExtras').innerHTML=member?'':`<div class="account-card"><div class="section-head"><div><span class="eyebrow soft">YOUR FAVORITES</span><h2>Oshi List</h2></div><a href="${s.group==='EDN48'?'edn-members.html':'tlp-members.html'}">ADD →</a></div><div class="oshi-list">${(s.oshiList||[]).map(x=>`<span>${esc(x.name)} <b>• ${esc(x.rank||'Kami-Oshi')}</b></span>`).join('')||'<small>ยังไม่มี Oshi — ไปเลือกสมาชิกที่ชอบได้เลย ✿</small>'}</div></div><div class="account-card"><div class="section-head"><div><span class="eyebrow soft">QUICK ACCESS</span><h2>Inventory</h2></div></div><div class="mini-inventory">${read(K.inventory,[]).filter(x=>x.username===s.username).slice(0,4).map(x=>`<span>${esc(x.title)}</span>`).join('')||'<small>ยังไม่มีไอเทม</small>'}</div></div>`;if(window.WTSTimeline)WTSTimeline.render(document.getElementById('timeline'),member?'ALL':'FAN');}function saveProfile(){const s=profile();if(!s)return;Promise.all([fileData(document.getElementById('photoFile').files[0]),fileData(document.getElementById('coverFile').files[0])]).then(([photo,cover])=>{let arr=s.type==='member'?read(K.accounts,[]):read(K.fan,[]),i=arr.findIndex(x=>x.username===s.username);arr[i].name=document.getElementById('editName').value.trim()||arr[i].name;arr[i].profile={...(arr[i].profile||{}),photo:photo||s.photo,cover:cover||s.cover,name:arr[i].name};write(s.type==='member'?K.accounts:K.fan,arr);document.getElementById('modal').classList.remove('open');draw()})}document.getElementById('edit').onclick=()=>{const s=profile();document.getElementById('editName').value=s.display;document.getElementById('modal').classList.add('open')};document.getElementById('avatarBtn').onclick=()=>document.getElementById('edit').click();document.getElementById('coverBtn').onclick=()=>document.getElementById('edit').click();document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('save').onclick=saveProfile;document.getElementById('logout').onclick=WTS.logout;draw()})();</script></body></html>
