<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY ACCOUNT • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app account-page"><header class="top"><a href="javascript:history.back()">‹</a><div class="brand" id="accountTitle">MY ACCOUNT</div><a href="index.html">⌂</a></header><section id="profileRoot"><div class="timeline-loading">กำลังโหลด Account…</div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="shop.html"><span>🛍</span>Shop</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html" class="active"><span>●</span>Account</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="wts-cloud.js"></script><script src="site-brand.js"></script><script>
const root=document.getElementById('profileRoot'),esc=WTSCloud.esc,fmt=n=>Number(n||0).toLocaleString('en-US');
const bg=u=>u?`style="background-image:url('${esc(u)}')"`:'';
async function uploadEdit(p){const photo=document.getElementById('photoFile').files[0],cover=document.getElementById('coverFile').files[0];try{let avatar=p.avatar_url,cv=p.cover_url;if(photo)avatar=await WTSCloud.upload('avatars',photo);if(cover)cv=await WTSCloud.upload('covers',cover);await WTSCloud.updateProfile({avatar_url:avatar,cover_url:cv});render()}catch(e){alert(e.message)}}
async function saveOshi(){try{const ids=[...document.querySelectorAll('#oshiList option:checked')].map(x=>x.value);const kami=document.getElementById('kami').value||null;await WTSCloud.setOshi(ids,kami);render()}catch(e){alert(e.message)}}
async function render(){try{const me=await WTSCloud.session();const q=new URLSearchParams(location.search).get('member');const members=await WTSCloud.members();let target=me;if(q)target=members.find(x=>x.username===q)||members.find(x=>x.id===q)||null;if(!target){root.innerHTML=`<section class="account-empty"><div class="account-empty-icon">✦</div><h1>MY ACCOUNT</h1><p>เข้าสู่ระบบเพื่อเปิดพื้นที่ของคุณ</p><div class="account-entry"><a class="primary" href="login.html?return=account.html">LOGIN</a><a class="ghost-btn" href="register.html">สมัครบัญชีแฟนคลับ</a></div></section>`;return}
const owner=!!me&&me.id===target.id,isMember=target.role==='member';accountTitle.textContent=owner?'MY ACCOUNT':target.display_name;
if(isMember){const posts=(await WTSCloud.timeline(target.group_name)).filter(x=>x.member?.id===target.id);root.innerHTML=`<section class="social-profile member-view"><div class="profile-cover member-cover" ${bg(target.cover_url)}><div class="cover-overlay"></div>${owner?'<label class="cover-edit-hint">แก้ Cover<input id="coverFile" type="file" accept="image/*"></label>':''}</div><div class="profile-main member-profile-main"><div class="profile-avatar-wrap"><div class="profile-avatar" ${bg(target.avatar_url)}>${target.avatar_url?'':esc((target.display_name||'M')[0])}</div>${owner?'<label class="avatar-edit">Edit<input id="photoFile" type="file" accept="image/*"></label>':''}</div><h1>${esc(target.display_name||'NAME')}</h1><div class="profile-nickname">${esc(target.group_name)} MEMBER</div>${owner?'<button class="primary" onclick="uploadEdit(targetCache)">SAVE PROFILE</button>':'<button class="profile-action star-action" onclick="alert(\'Send STAR จากหน้า Timeline ได้เลย\')">⭐<span>STAR</span></button>'}</div></section><section class="profile-section-bar"><span>✦</span><b>Timeline</b><small>${posts.length} posts</small></section><section class="profile-posts"><div class="profile-posts-head"><h2>Timeline</h2><span>MEMBER POSTS</span></div>${posts.length?posts.map(post=>`<article class="profile-post-card"><div class="profile-post-meta"><div class="mini-avatar" ${bg(target.avatar_url)}>${target.avatar_url?'':esc((target.display_name||'M')[0])}</div><div><b>${esc(target.display_name)}</b><small>${esc(target.group_name)} · ${new Date(post.created_at).toLocaleString('th-TH')}</small></div></div><div class="profile-post-text">${esc(post.body).replace(/\n/g,'<br>')}</div>${post.media_url?(post.media_type==='video'?`<video class="profile-post-media" controls src="${esc(post.media_url)}"></video>`:`<img class="profile-post-media" src="${esc(post.media_url)}">`):''}<div class="profile-post-foot">⭐ ${fmt(post.star_count)} STAR · ${fmt(post.comment_count)} Comments</div></article>`).join(''):'<div class="timeline-empty"><div>✦</div><b>ยังไม่มีโพสต์</b><span>โพสต์ของสมาชิกจะแสดงตรงนี้</span></div>'}</section>${owner?'<button class="logout-wide" onclick="WTSCloud.signOut()">ออกจากบัญชี</button>':''}`;if(owner){window.targetCache=target;document.getElementById('photoFile')?.addEventListener('change',()=>{});document.getElementById('coverFile')?.addEventListener('change',()=>{})}return}
const [w,oshi]=await Promise.all([WTSCloud.wallet(),WTSCloud.oshi()]);const kami=target.kami_oshi?members.find(x=>x.id===target.kami_oshi):null;const inv=await WTSCloud.inventory();root.innerHTML=`<section class="social-profile fan-view"><div class="profile-cover fan-cover" ${bg(target.cover_url)}><div class="cover-overlay"></div>${owner?'<label class="cover-edit-hint">แก้ Cover<input id="coverFile" type="file" accept="image/*"></label>':''}</div><div class="profile-main"><div class="profile-avatar-wrap"><div class="profile-avatar" ${bg(target.avatar_url)}>${target.avatar_url?'':esc((target.display_name||'F')[0])}</div>${owner?'<label class="avatar-edit">Edit<input id="photoFile" type="file" accept="image/*"></label>':''}</div>${kami?`<div class="fan-kami-title">+ ${esc(kami.display_name)} • Kami-Oshi</div>`:''}<h1>${esc(target.display_name||'FAN')}</h1><div class="profile-nickname">WAY TO SHINE FAN</div><div class="profile-stats fan-stats"><div><b>${fmt(oshi.length)}</b><small>Oshi</small></div><div><b>${fmt(w.star)}</b><small>STAR</small></div><div><b>${fmt(w.token)}</b><small>TOKEN</small></div><div><b>${fmt(inv.length)}</b><small>Inventory</small></div></div>${owner?'<button class="primary" onclick="uploadEdit(targetCache)">SAVE PROFILE</button>':''}</div></section><section class="fan-action-row"><button class="profile-action star-action" onclick="location.href='shop.html'">⭐<span>STAR</span></button><button class="profile-action" onclick="document.getElementById('fanTools').scrollIntoView({behavior:'smooth'})">♡<span>Oshi List</span></button><button class="profile-action" onclick="location.href='shop.html#merch'">🛍<span>Shop</span></button><button class="profile-action" onclick="document.getElementById('inventory').scrollIntoView({behavior:'smooth'})">🎒<span>Inventory</span></button></section><section class="fan-dashboard" id="fanTools"><div class="dashboard-title">MY FAN SPACE</div><div class="fan-grid"><div class="fan-box wide"><span>♡</span><b>Oshi List</b><small>${oshi.length?oshi.map(x=>esc(x.display_name)).join(' · '):'ยังไม่ได้เลือก Oshi'}</small></div><div class="fan-box"><span>⭐</span><b>${fmt(w.star)}</b><small>STAR</small></div><div class="fan-box"><span>🪙</span><b>${fmt(w.token)}</b><small>TOKEN</small></div><div class="fan-box wide" id="inventory"><span>🎒</span><b>Inventory</b><small>${inv.length?inv.map(x=>esc(x.item_name)).join(' · '):'ยังไม่มีไอเทม'}</small></div></div>${owner?`<div class="fan-settings"><div class="editor-title">OSHI SETTINGS</div><label>Oshi List<select id="oshiList" multiple size="5">${members.map(m=>`<option value="${m.id}" ${oshi.some(x=>x.id===m.id)?'selected':''}>${esc(m.display_name)} • ${esc(m.group_name)}</option>`).join('')}</select></label><label>Kami-Oshi<select id="kami"><option value="">ยังไม่ได้เลือก</option>${members.map(m=>`<option value="${m.id}" ${target.kami_oshi===m.id?'selected':''}>${esc(m.display_name)} • ${esc(m.group_name)}</option>`).join('')}</select></label><button class="primary" onclick="saveOshi()">SAVE OSHI</button></div>`:''}</section>${owner?'<button class="logout-wide" onclick="WTSCloud.signOut()">ออกจากบัญชี</button>':''}`;window.targetCache=target;
}catch(e){root.innerHTML=`<div class="timeline-empty"><div>!</div><b>โหลด Account ไม่สำเร็จ</b><span>${esc(e.message||'ตรวจสอบ Supabase')}</span></div>`}}
render();
</script></body></html>
