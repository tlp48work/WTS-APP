<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY ACCOUNT • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app account-page"><header class="top"><a href="javascript:history.back()" aria-label="Back">‹</a><div class="brand" id="accountTitle">MY ACCOUNT</div><a href="admin.html" aria-label="Admin">⚙</a></header><section id="profileRoot"></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html" class="active"><span>●</span>Account</a></nav><script src="wts-core.js"></script><script>
const ACC='wts_member_accounts_v1', FAN='wts_fan_accounts_v1', STAR='wts_profile_stars_v1', POSTS='wts_timeline_v1';
const $=id=>document.getElementById(id); const get=(k,d)=>WTS.get(k,d), set=(k,v)=>WTS.set(k,v);
const members=()=>get(ACC,[]), fans=()=>get(FAN,[]), session=()=>WTS.session();
const initials=n=>String(n||'U').trim().slice(0,1).toUpperCase();
const bg=url=>url?`background-image:url("${WTS.esc(url)}")`:'';
const fmt=n=>WTS.fmt(n);
function dateText(t){try{return new Intl.DateTimeFormat('th-TH',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t))}catch{return ''}}
function postCard(p){const media=p.media?(p.mediaType==='video'?`<video class="profile-post-media" controls playsinline src="${WTS.esc(p.media)}"></video>`:`<img class="profile-post-media" src="${WTS.esc(p.media)}" alt="Post" loading="lazy">`):'';return `<article class="profile-post-card"><div class="profile-post-meta"><div class="mini-avatar" style="${bg(p.photo)}">${p.photo?'':WTS.esc(initials(p.name))}</div><div><b>${WTS.esc(p.name)}</b><small>${dateText(p.createdAt)}</small></div></div>${p.text?`<div class="profile-post-text">${WTS.esc(p.text).replace(/\n/g,'<br>')}</div>`:''}${media}<div class="profile-post-foot"><span>⭐ ${fmt(p.stars||0)} STAR</span><span>♡ ${fmt(p.comments||0)} Comments</span></div></article>`}
function editBox(){return `<div class="profile-editor"><div class="editor-title">EDIT PROFILE</div><div class="editor-row"><label>PROFILE PHOTO<input id="profilePhotoFile" type="file" accept="image/*"></label><label>COVER PHOTO<input id="profileCoverFile" type="file" accept="image/*"></label></div><button id="saveProfile" class="primary">SAVE PROFILE</button></div>`}
function fanSettings(target,oshi,kami){const list=members();return `<div class="fan-settings"><div class="editor-title">OSHI SETTINGS</div><label>Oshi List<select id="oshiSelect" multiple size="4">${list.map(m=>{const selected=oshi.includes(m.name);const label=`${m.name}${kami===m.name?' • Kami-Oshi':''}`;return `<option value="${WTS.esc(m.name)}" ${selected?'selected':''}>${WTS.esc(label)} • ${WTS.esc(m.group||'')}</option>`}).join('')}</select></label><label>Kami-Oshi<select id="kamiSelect"><option value="">ยังไม่ได้เลือก</option>${list.map(m=>`<option value="${WTS.esc(m.name)}" ${kami===m.name?'selected':''}>${WTS.esc(m.name)} • ${WTS.esc(m.group||'')}</option>`).join('')}</select></label><button class="primary" id="saveOshi">SAVE OSHI</button></div>`}
function bindEdit(target,isMember){let photo=target.photo||'',cover=target.cover||'';const pf=$('profilePhotoFile'),cf=$('profileCoverFile'),save=$('saveProfile');if(pf)pf.onchange=e=>WTS.fileToData(e.target.files[0],x=>photo=x);if(cf)cf.onchange=e=>WTS.fileToData(e.target.files[0],x=>cover=x);if(save)save.onclick=()=>{const key=isMember?ACC:FAN,d=get(key,[]),i=d.findIndex(x=>x.username===target.username);if(i<0)return;d[i].photo=photo;d[i].cover=cover;set(key,d);render()};const os=$('saveOshi');if(os)os.onclick=()=>{const selected=Array.from($('oshiSelect').selectedOptions).map(o=>o.value),kami=$('kamiSelect').value;const d=get('wts_fan_oshi_v1',{});d[target.username]=selected;set('wts_fan_oshi_v1',d);const k=get('wts_fan_kami_v1',{});k[target.username]=kami;set('wts_fan_kami_v1',k);render()}}
function sendStar(target){const me=session();if(!me)return location.href='login.html?return='+encodeURIComponent(location.href);if(me.username===target.username)return alert('ไม่สามารถส่ง STAR ให้ตัวเองได้');const available=Number(localStorage.getItem('wts_star')||100);if(available<1)return alert('STAR ของคุณไม่พอ');let amount=prompt('จำนวน STAR ที่ต้องการส่ง','1');if(amount===null)return;amount=Math.floor(Number(amount));if(!Number.isFinite(amount)||amount<1||amount>available)return alert('จำนวน STAR ไม่ถูกต้อง');localStorage.setItem('wts_star',available-amount);const scores=get(STAR,{});scores[target.username]=(scores[target.username]||0)+amount;set(STAR,scores);render()}
function render(){const me=session(), q=new URLSearchParams(location.search).get('member');let target=q?members().find(x=>x.username===q)||members().find(x=>x.name===q):me;if(!target){$('profileRoot').innerHTML=`<section class="account-empty"><div class="account-empty-icon">✦</div><h1>MY ACCOUNT</h1><p>เข้าสู่ระบบเพื่อดูบัญชีของคุณ</p><div class="account-entry"><a class="primary" href="login.html?return=account.html">เข้าสู่บัญชี</a><a class="ghost-btn" href="register.html">สร้างบัญชีแฟนคลับ</a></div></section>`;return}
const isMember=members().some(x=>x.username===target.username), isOwner=!!me&&me.username===target.username, posts=get(POSTS,[]).filter(p=>p.username===target.username).sort((a,b)=>b.createdAt-a.createdAt), stars=get(STAR,{})[target.username]||0;
if(isMember){
 $('accountTitle').textContent='MEMBER ACCOUNT';
 $('profileRoot').innerHTML=`<section class="social-profile member-view"><div class="profile-cover member-cover" style="${bg(target.cover||'')}"><div class="cover-overlay"></div></div><div class="profile-main member-profile-main"><div class="profile-avatar-wrap"><div class="profile-avatar" style="${bg(target.photo||'')}">${target.photo?'':WTS.esc(initials(target.name))}</div></div><h1>${WTS.esc(target.name||'NAME')}</h1><div class="profile-nickname">${WTS.esc(target.group||'EDN48')}</div><div class="member-star-total">⭐ ${fmt(stars)} STAR</div><div class="member-action-row"><button class="profile-action star-action" id="sendProfileStar">⭐<span>STAR</span></button></div>${isOwner?editBox():''}</div></section><section class="profile-section-bar"><span>✦</span><b>Timeline</b><small>${posts.length} posts</small></section><section class="profile-posts"><div class="profile-posts-head"><h2>Timeline</h2><span>MEMBER POSTS</span></div>${posts.length?posts.map(postCard).join(''):`<div class="timeline-empty"><div>✦</div><b>ยังไม่มีโพสต์</b><span>โพสต์ของสมาชิกจะแสดงตรงนี้</span></div>`}</section>${isOwner?`<button class="logout-wide" id="logoutBtn">ออกจากบัญชี</button>`:''}`;
}else{
 $('accountTitle').textContent='MY ACCOUNT';const oshi=get('wts_fan_oshi_v1',{})[target.username]||[],kami=get('wts_fan_kami_v1',{})[target.username]||'',token=Number(localStorage.getItem('wts_token')||10),star=Number(localStorage.getItem('wts_star')||100),inv=get('wts_inventory_v1',{})[target.username]||[];
 const oshiText=oshi.length?oshi.map(n=>`${WTS.esc(n)}${n===kami?' • Kami-Oshi':''}`).join(' · '):'ยังไม่ได้เลือก Oshi';
 $('profileRoot').innerHTML=`<section class="social-profile fan-view"><div class="profile-cover fan-cover" style="${bg(target.cover||'')}"><div class="cover-overlay"></div></div><div class="profile-main"><div class="profile-avatar-wrap"><div class="profile-avatar" style="${bg(target.photo||'')}">${target.photo?'':WTS.esc(initials(target.name))}</div></div>${kami?`<div class="fan-kami-title">+ Kami-Oshi • ${WTS.esc(kami)}</div>`:''}<h1>${WTS.esc(target.name||'FAN')}</h1><div class="profile-nickname">WAY TO SHINE FAN</div><div class="profile-stats fan-stats"><div><b>${fmt(oshi.length)}</b><small>Oshi</small></div><div><b>${fmt(star)}</b><small>STAR</small></div><div><b>${fmt(token)}</b><small>TOKEN</small></div><div><b>${fmt(inv.length)}</b><small>Inventory</small></div></div>${isOwner?editBox():''}</div></section><section class="fan-dashboard"><div class="dashboard-title">MY FAN SPACE</div><div class="fan-grid"><div class="fan-box wide"><span>♡</span><b>Oshi List</b><small>${oshiText}</small></div><div class="fan-box"><span>⭐</span><b>${fmt(star)}</b><small>STAR</small></div><div class="fan-box"><span>🪙</span><b>${fmt(token)}</b><small>TOKEN</small></div><div class="fan-box wide"><span>🎒</span><b>Inventory</b><small>${inv.length?inv.map(WTS.esc).join(' · '):'ยังไม่มีไอเทม'}</small></div></div>${isOwner?fanSettings(target,oshi,kami):''}</section><section class="profile-posts"><div class="profile-posts-head"><h2>Timeline</h2><span>MY POSTS</span></div>${posts.length?posts.map(postCard).join(''):`<div class="timeline-empty"><div>✦</div><b>ยังไม่มีโพสต์</b><span>โพสต์ของคุณจะปรากฏตรงนี้</span></div>`}</section>${isOwner?`<button class="logout-wide" id="logoutBtn">ออกจากบัญชี</button>`:''}`;
}
const send=$('sendProfileStar');if(send)send.onclick=()=>sendStar(target);const out=$('logoutBtn');if(out)out.onclick=()=>WTS.logout();bindEdit(target,isMember)}
render();
</script><script src="site-brand.js"></script></body></html>
