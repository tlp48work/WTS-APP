<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TULIPS ZONE • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app tlp"><header class="top glass"><a href="tlp48.html">‹</a><div class="brand">TULIPS ZONE</div><a href="account.html">●</a></header><section class="club-head"><div class="club-orb">✿</div><span class="eyebrow">TLP48 FAN SPACE</span><h1>TULIPS ZONE</h1><p>พื้นที่จัดการ STAR, TOKEN, Inventory และของสะสมของคุณ</p></section><section class="section"><div class="wallet"><div><small>TOKEN</small><b id="token">0</b></div><div><small>STAR</small><b id="star">0</b></div><a href="account.html">ACCOUNT ›</a></div><div class="quick-grid three"><a href="#redeem"><span>🎟</span>Redeem Code</a><a href="#shop"><span>⭐</span>Buy STAR</a><a href="major-vote.html"><span>▣</span>Major Vote</a></div><div class="club-block" id="redeem"><div class="section-head"><div><span class="eyebrow soft">CODE</span><h2>REDEEM CODE</h2></div></div><div class="redeem-box"><input id="code" placeholder="ใส่ Redeem Code"><button id="redeemBtn">REDEEM</button><p id="redeemMsg"></p></div></div><div class="club-block" id="shop"><div class="section-head"><div><span class="eyebrow soft">STAR SHOP</span><h2>BUY STAR</h2></div></div><div id="starShop" class="shop-grid"></div></div><div class="club-block"><div class="section-head"><div><span class="eyebrow soft">MERCHANDISE</span><h2>SHOP & MERCHANDISE</h2></div></div><div id="merch" class="merch-grid"></div></div><div class="club-block"><div class="section-head"><div><span class="eyebrow soft">YOUR ITEMS</span><h2>INVENTORY</h2></div></div><div id="inventory" class="inventory-grid"></div></div></section></main><nav class="bottom"><a href="tlp48.html"><span>⌂</span>Home</a><a href="tlp-members.html"><span>☷</span>Members</a><a class="active" href="tlp-club.html"><span>✿</span>ZONE</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>
(()=>{const K=WTS.K,read=WTS.read,write=WTS.write,session=WTS.session,change=WTS.changeBalance,fmt=WTS.fmt,esc=WTS.esc;function draw(){const s=session();document.getElementById('token').textContent=fmt(s?.token||0);document.getElementById('star').textContent=fmt(s?.star||0);const packages=[...[]];document.getElementById('starShop').innerHTML=[{stars:10,cost:5},{stars:50,cost:20},{stars:120,cost:45},{stars:300,cost:100}].map(x=>`<button class="shop-item" data-stars="${x.stars}" data-cost="${x.cost}"><span>⭐</span><b>+${x.stars} STAR</b><small>${x.cost} TOKEN</small></button>`).join('');const m=read(K.merch,[]).filter(x=>!x.group||x.group==='TLP48');document.getElementById('merch').innerHTML=m.map(x=>`<article class="merch-card">${x.image?`<img src="${x.image}">`:'<div class="merch-placeholder">✦</div>'}<div><small>${x.stock>0?x.stock+' LEFT':'SOLD OUT'}</small><b>${esc(x.title)}</b><span>${x.cost} TOKEN</span><button ${x.stock<=0?'disabled':''} data-buy="${x.id}">BUY</button></div></article>`).join('')||'<div class="empty-card">ยังไม่มีสินค้าเปิดขาย</div>';const inv=read(K.inventory,[]).filter(x=>x.username===s?.username);document.getElementById('inventory').innerHTML=inv.map(x=>`<div class="inventory-item">${x.image?`<img src="${x.image}">`:'<span>✦</span>'}<div><b>${esc(x.title)}</b><small>${esc(x.receivedAt||'')}</small></div></div>`).join('')||'<div class="empty-card">Inventory ยังว่างอยู่ ✿</div>';document.querySelectorAll('.shop-item').forEach(b=>b.onclick=()=>buyStar(Number(b.dataset.stars),Number(b.dataset.cost)));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyMerch(b.dataset.buy))}function buyStar(stars,cost){const s=session();if(!s)return location.href='login.html?return='+encodeURIComponent(location.pathname);if(Number(s.token||0)<cost)return alert('TOKEN ไม่พอ');change('token',-cost);change('star',stars);draw()}function buyMerch(id){const s=session();if(!s)return location.href='login.html?return='+encodeURIComponent(location.pathname);let m=read(K.merch,[]),i=m.findIndex(x=>x.id===id),x=m[i];if(!x||x.stock<=0)return;if(Number(s.token||0)<Number(x.cost||0))return alert('TOKEN ไม่พอ');change('token',-Number(x.cost||0));m[i].stock--;write(K.merch,m);let inv=read(K.inventory,[]);inv.push({username:s.username,title:x.title,image:x.image||'',receivedAt:new Date().toLocaleString('th-TH')});write(K.inventory,inv);if(Number(x.rewardToken||0)>0)change('token',Number(x.rewardToken));alert('ซื้อสำเร็จ! ของเข้า Inventory แล้ว');draw()}document.getElementById('redeemBtn').onclick=()=>{const s=session();if(!s)return location.href='login.html?return='+encodeURIComponent(location.pathname);let code=document.getElementById('code').value.trim().toUpperCase(),d=read(K.redeem,[]),i=d.findIndex(x=>x.code.toUpperCase()===code&&!x.used);if(i<0)return document.getElementById('redeemMsg').textContent='โค้ดไม่ถูกต้องหรือใช้ไปแล้ว';const x=d[i];d[i].used=true;d[i].usedBy=s.username;write(K.redeem,d);if(x.token)change('token',Number(x.token));if(x.star)change('star',Number(x.star));document.getElementById('redeemMsg').textContent=`ได้รับ ${x.token||0} TOKEN และ ${x.star||0} STAR แล้ว ✦`;draw()};draw()})();</script></body></html>
