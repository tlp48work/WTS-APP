<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="wts-app.js"></script></head><body><main class="app"><header class="top"><a href="javascript:history.back()">‹</a><div class="brand">MEMBER</div><a href="account.html">●</a></header><div id="profile"></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="shop.html"><span>♜</span>Shop</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>
function render(){const id=new URLSearchParams(location.search).get('id');const d=WTS.load(),m=d.members.find(x=>x.id===id)||d.members[0];if(!m){profile.innerHTML='<div class="timeline-empty">ยังไม่มีสมาชิก</div>';return}const stars=d.posts.filter(p=>p.memberId===m.id).reduce((n,p)=>n+(p.stars||0),0)+(d.spark.votes?.[m.id]||0);profile.innerHTML=`<section class="public-member"><div class="cover-edit public-cover" style="background-image:${m.cover?`url(${m.cover})`:''}"></div><div class="member-profile-main"><div class="profile-avatar big">${m.avatar?`<img src="${m.avatar}">`:'●'}</div><h1>${WTS.esc(m.name)}</h1><p class="member-dot">${WTS.esc(m.group)} · Generation ${WTS.esc(m.gen||'-')}</p><div class="public-member-stats"><div><b>—</b><small>OSHI</small></div><div><b>${WTS.fmt(stars)}</b><small>STAR</small></div><div><b>—</b><small>LIKE</small></div></div><div class="public-member-actions"><button onclick="sendStar('${m.id}')">⭐<span>STAR</span></button></div></div></section><section class="section"><div class="vip-line"><b>☆ Top Today VIP</b><span>›</span></div><h2 class="section-title">TIMELINE</h2><div data-timeline="${m.group}" class="timeline" id="memberTimeline"></div></section>`;renderOnlyMemberPosts(m.id)}
function renderOnlyMemberPosts(id){const d=WTS.load();const root=document.getElementById('memberTimeline');const posts=d.posts.filter(p=>p.memberId===id).sort((a,b)=>b.createdAt-a.createdAt);root.innerHTML=posts.length?posts.map(WTS._postCard?WTS._postCard:()=> '').join(''):'<div class="timeline-empty"><b>ยังไม่มีโพสต์</b><span>โพสต์ของสมาชิกจะแสดงที่นี่</span></div>'}
function sendStar(id){const u=WTS.user();if(!u||u.role!=='fan'){location.href='login.html?return='+encodeURIComponent(location.pathname+location.search);return}const d=WTS.load(),f=d.fans.find(x=>x.id===u.id);if(!f||f.star<1)return alert('STAR ไม่พอ');let n=prompt('จำนวน STAR','1');n=Math.floor(Number(n));if(!Number.isFinite(n)||n<1||n>f.star)return alert('จำนวนไม่ถูกต้อง');f.star-=n;const posts=d.posts.filter(p=>p.memberId===id);if(posts.length)posts[0].stars=(posts[0].stars||0)+n;else{d.spark.votes=d.spark.votes||{};d.spark.votes[id]=(d.spark.votes[id]||0)+n}WTS.save(d);alert('ส่ง STAR แล้ว ✨');render()}
document.addEventListener('DOMContentLoaded',render)
</script></body></html>
