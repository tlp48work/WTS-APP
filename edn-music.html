<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDN48 Music Audio</title><link rel="stylesheet" href="style.css"></head><body><main class="app edn"><header class="top"><a href="edn48.html">‹</a><div class="brand">MUSIC AUDIO</div><a href="account.html">●</a></header><section class="section"><div class="song-slider"><article class="song-slide edn"><div><span class="eyebrow">EDN48 MUSIC</span><h2>YOUR NEXT SONG</h2><p>แบนเนอร์เพลงสลับอัตโนมัติ</p></div></article><article class="song-slide edn"><div><span class="eyebrow">AUDIO COLLECTION</span><h2>UNLOCK & LISTEN</h2><p>ปลดล็อกแต่ละเพลงด้วย TOKEN</p></div></article><article class="song-slide edn"><div><span class="eyebrow">WAY TO SHINE</span><h2>MUSIC AUDIO</h2><p>เพลงของ EDN48</p></div></article></div><h2 class="section-title">SONGS <small style="margin-left:auto;font-size:12px;color:#999">TOKEN: <span id="tokenNow"></span></small></h2><div id="songsRoot" class="song-grid"></div></section></main><nav class="bottom"><a href="edn48.html"><span>⌂</span>Home</a><a href="edn-members.html"><span>☷</span>Members</a><a href="edn-music.html"><span>♫</span>Music</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>function tok(){return Number(localStorage.getItem("wts_token")||10)}function unlock(g,i){let t=tok();if(t<2)return alert("TOKEN ไม่พอ");localStorage.setItem("wts_token",t-2);localStorage.setItem(`unlock_${g}_${i}`,1);draw(g)}function draw(g){let a=(JSON.parse(localStorage.getItem("wts_songs_v1")||"{}")[g]||[]),r=document.getElementById("songsRoot");tokenNow.textContent=tok();r.innerHTML=a.length?a.map((x,i)=>{let u=localStorage.getItem(`unlock_${g}_${i}`);let cover=x.cover?`<img src="${x.cover}" style="width:100%;height:125px;object-fit:cover">`:x.title;return `<article class=song-card><div class=song-cover>${cover}</div><div class=song-body><b>${x.title}</b><p>${x.release||""}</p>${u?(x.audio?`<audio controls style="width:100%" src="${x.audio}"></audio>`:'<span class=unlocked>🔓 UNLOCKED • AUDIO READY</span>'):`<button class=lock-btn onclick="unlock('${g}',${i})">🔒 UNLOCK • 2 TOKEN</button>`}</div></article>`}).join(""): '<div class=member-empty>ยังไม่มีเพลงในระบบ<br><small>แอดมินเพิ่มเพลงและปกได้จาก ADMIN PANEL</small></div>'}draw("EDN48");</script></body></html>
