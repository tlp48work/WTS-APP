<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDN48 Music Audio</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app edn"><header class="top glass"><a href="edn48.html">‹</a><div class="brand">MUSIC AUDIO</div><a href="account.html">●</a></header><section class="section"><div class="music-hero" id="musicHero"></div><div class="section-head"><div><span class="eyebrow soft">COLLECTION</span><h2>EDN48 SONGS</h2></div><span class="wallet-pill">🪙 <b id="token">0</b></span></div><div id="songs" class="song-grid"></div></section></main><nav class="bottom"><a href="edn48.html"><span>⌂</span>Home</a><a href="edn-members.html"><span>☷</span>Members</a><a class="active" href="edn-music.html"><span>♫</span>Music</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>
(()=>{const g='EDN48',K=WTS.K,read=WTS.read,write=WTS.write,session=WTS.session,fmt=WTS.fmt,esc=WTS.esc;function songs(){return read(K.songs,{})[g]||[]}function draw(){const s=session();document.getElementById('token').textContent=fmt(s?.token||0);const a=songs();document.getElementById('songs').innerHTML=a.map((x,i)=>{const unlocked=(s?.unlocks||[]).includes(x.id);return `<article class="song-card"><div class="song-cover" style="${x.cover?`background-image:linear-gradient(180deg,transparent,rgba(15,15,25,.7)),url('${x.cover}')`:''}"><span>${esc(x.title||'SONG')}</span></div><div class="song-body"><div class="song-meta"><b>${esc(x.title)}</b><small>${esc(x.release||'')}</small></div>${unlocked&&x.audio?`<audio controls src="${x.audio}"></audio>`:unlocked?'<div class="unlocked">🔓 AUDIO UNLOCKED</div>':`<button class="lock-btn" data-id="${esc(x.id)}">🔒 UNLOCK • ${x.cost||2} TOKEN</button>`}</div></article>`}).join('')||'<div class="empty-card">ยังไม่มีเพลงในระบบ</div>';document.querySelectorAll('.lock-btn').forEach(b=>b.onclick=()=>unlock(b.dataset.id))}async function unlock(id){const s=session();if(!s)return location.href='login.html?return='+encodeURIComponent(location.pathname);const arr=read(K.songs,{})[g]||[],x=arr.find(v=>v.id===id),cost=Number(x?.cost||2);if(Number(s.token||0)<cost)return alert('TOKEN ไม่พอ');const accounts=s.type==='member'?read(K.accounts,[]):read(K.fan,[]),i=accounts.findIndex(v=>v.username===s.username);accounts[i].token=Math.max(0,Number(accounts[i].token||0)-cost);accounts[i].unlocks=[...(accounts[i].unlocks||[]),id];write(s.type==='member'?K.accounts:K.fan,accounts);draw()}const a=songs();document.getElementById('musicHero').innerHTML=a.slice(0,5).map((x,i)=>`<div class="music-slide ${i===0?'active':''}" style="${x.cover?`background-image:linear-gradient(110deg,rgba(20,20,35,.7),rgba(20,20,35,.1)),url('${x.cover}')`:''}"><small>EDN48 • AUDIO</small><b>${esc(x.title||'MUSIC')}</b><span>UNLOCK • LISTEN • SHINE</span></div>`).join('')||'<div class="music-slide active"><small>MUSIC AUDIO</small><b>Your next song is waiting.</b><span>ปลดล็อกด้วย TOKEN</span></div>';let i=0,slides=[...document.querySelectorAll('.music-slide')];if(slides.length>1)setInterval(()=>{slides[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active')},4500);draw()})();</script></body></html>
