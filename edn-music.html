<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDN48 Music Audio</title><link rel="stylesheet" href="style.css"><script src="wts-app.js"></script></head><body><main class="app edn"><header class="top"><a href="edn48.html">‹</a><div class="brand">MUSIC AUDIO</div><a href="account.html">●</a></header><section class="section"><div class="song-slider"><article class="song-slide edn"><div><span class="eyebrow">EDN48 MUSIC</span><h2>YOUR NEXT SONG</h2><p>แบนเนอร์เพลงสลับอัตโนมัติ</p></div></article><article class="song-slide edn"><div><span class="eyebrow">AUDIO COLLECTION</span><h2>UNLOCK & LISTEN</h2><p>ปลดล็อกแต่ละเพลงด้วย TOKEN</p></div></article></div><h2 class="section-title">SONGS <small style="margin-left:auto;font-size:12px;color:#999">TOKEN: <span id="tokenNow">0</span></small></h2><div id="songsRoot" class="song-grid"></div></section></main><nav class="bottom"><a href="edn48.html"><span>⌂</span>Home</a><a href="edn48-members.html"><span>☷</span>Members</a><a class="active" href="edn48-music.html"><span>♫</span>Music</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>
const GROUP='EDN48';function draw(){const d=WTS.load(),u=WTS.user(),f=u?.role==='fan'?d.fans.find(x=>x.id===u.id):null;tokenNow.textContent=f?f.token:0;const a=d.songs.filter(x=>x.group===GROUP),r=document.getElementById('songsRoot');r.innerHTML=a.length?a.map(x=>{const unlocked=f?.unlockedSongs?.includes(x.id);return `<article class="song-card"><div class="song-cover">${x.cover?`<img src="${x.cover}">`:'♫'}</div><div class="song-body"><b>${WTS.esc(x.title)}</b><p>${x.release||''}</p>${unlocked?(x.audio?`<audio controls src="${x.audio}"></audio>`:'<span class="unlocked">🔓 AUDIO READY</span>'):`<button class="lock-btn" onclick="unlock('${x.id}')">🔒 UNLOCK • 2 TOKEN</button>`}</div></article>`}).join(''):'<div class="member-empty">ยังไม่มีเพลงในระบบ<br><small>Admin สามารถเลือกไฟล์เพลงและปกได้โดยตรง</small></div>'}
function unlock(id){const u=WTS.user();if(!u||u.role!=='fan'){location.href='login.html?return='+encodeURIComponent(location.pathname.split('/').pop());return}const d=WTS.load(),f=d.fans.find(x=>x.id===u.id);if(f.token<2)return alert('TOKEN ไม่พอ');f.token-=2;f.unlockedSongs=f.unlockedSongs||[];if(!f.unlockedSongs.includes(id))f.unlockedSongs.push(id);WTS.save(d);draw()}document.addEventListener('DOMContentLoaded',draw)
</script></body></html>
