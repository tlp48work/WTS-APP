<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">MEMBER LOGIN</div><span>✦</span></header><section class="form-card member-login-card"><div class="member-login-badge">✦</div><h1>MEMBER LOGIN</h1><p class="muted">เข้าสู่ระบบสำหรับสมาชิก EDN48 / TLP48 เพื่อโพสต์ใน Timeline</p><form id="memberLoginForm"><div class="field"><label>MEMBER USERNAME</label><input id="mu" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="mp" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">เข้าสู่ระบบสมาชิก</button><p id="msg" class="form-msg"></p></form></section></main><script>
const ACC='wts_member_accounts_v1';
function accounts(){try{return JSON.parse(localStorage.getItem(ACC)||'[]')}catch{return []}}
document.getElementById('memberLoginForm').onsubmit=e=>{e.preventDefault();const u=mu.value.trim(),p=mp.value;const a=accounts().find(x=>x.username===u&&x.password===p);if(!a){msg.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return}localStorage.setItem('wts_member_session',a.username);localStorage.setItem('wts_username',a.name);localStorage.setItem('wts_logged','1');const q=new URLSearchParams(location.search);location.href=q.get('return')||((a.group==='TLP48'?'tlp48.html':'edn48.html')+'#timeline')};
</script></body></html>
