<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Major Vote • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">⌂</a><div class="brand">MAJOR VOTE</div><a href="account.html">●</a></header><section class="balance"><div><div class="value"><span data-token-logo>🪙</span> <span data-user-token>0</span></div><small>Token</small></div><div><div class="value">▣ <span id="voteCount">0</span></div><small>Active Events</small></div></section><section class="section"><div id="voteRoot" class="vote-grid"></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="shop.html"><span>▣</span>Shop</a><a href="account.html"><span>●</span>Account</a></nav><script src="app.js"></script><script>function render(){const a=WTS.read(WTS.votes,[]),r=document.getElementById('voteRoot');const active=a.filter(x=>x.status==='open');voteCount.textContent=active.length;r.innerHTML=a.length?a.map(x=>`<article class="vote-card ${x.status}">${x.cover?`<img src="${x.cover}">`:''}<div><span class="status-pill">${x.status.toUpperCase()}</span><h2>${WTS.escapeHtml(x.name)}</h2><p>${x.start} → ${x.end}</p>${x.status==='open'?`<button class="primary" onclick="vote('${x.id}')">VOTE WITH TOKEN</button>`:`<button class="secondary" disabled>VOTING ${x.status.toUpperCase()}</button>`}</div></article>`).join(''):'<div class="empty-post">ยังไม่มี Major Vote Event</div>'}function vote(id){const u=WTS.current();if(!u)return location.href='login.html?return=major-vote.html';if(u.token<1)return alert('TOKEN ไม่พอ');const a=WTS.read(WTS.votes,[]),x=a.find(v=>v.id===id);if(!x||x.status!=='open')return alert('ขณะนี้ยังไม่เปิดโหวต');u.token--;x.votes=(x.votes||0)+1;WTS.save(WTS.votes,a);WTS.saveUser(u);alert('โหวตสำเร็จ');render()}render();</script></body></html>
