<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Major Vote • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="wts-app.js"></script></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">MAJOR VOTE</div><a href="account.html">●</a></header><section class="section"><div class="vote-wallet"><span>▣ MAJOR VOTE TOKEN</span><b id="major">0</b></div><div id="events" class="event-list"></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a class="active" href="major-vote.html"><span>▣</span>Vote</a><a href="shop.html"><span>♜</span>Shop</a><a href="account.html"><span>●</span>Account</a></nav><script>
function render(){const d=WTS.load(),u=WTS.user(),f=u?.role==='fan'?d.fans.find(x=>x.id===u.id):null;major.textContent=f?WTS.fmt(f.major||0):0;events.innerHTML=d.events.length?d.events.map(e=>{const autoOpen=e.resumeAt&&Date.now()>=new Date(e.resumeAt).getTime();const open=e.open||autoOpen;const ended=e.end&&Date.now()>new Date(e.end).getTime();return `<article class="vote-event">${e.cover?`<img src="${e.cover}">`:''}<div class="vote-event-body"><span class="vote-status ${ended?'ended':open?'open':'paused'}">${ended?'ENDED':open?'VOTING OPEN':'VOTING PAUSED'}</span><h2>${WTS.esc(e.name)}</h2><p>${e.start?new Date(e.start).toLocaleString('th-TH'):''} → ${e.end?new Date(e.end).toLocaleString('th-TH'):''}</p><button class="primary" ${(!open||ended)?'disabled':''} onclick="vote('${e.id}')">VOTE NOW</button></div></article>`}).join(''):'<div class="timeline-empty"><b>ยังไม่มี Major Vote Event</b><span>Admin สามารถสร้างอีเวนท์ได้</span></div>'}
function vote(id){const u=WTS.user();if(!u||u.role!=='fan'){location.href='login.html?return=major-vote.html';return}const d=WTS.load(),f=d.fans.find(x=>x.id===u.id),e=d.events.find(x=>x.id===id);if(!f||f.major<1)return alert('Major Vote Token ไม่พอ');const open=e.open||(e.resumeAt&&Date.now()>=new Date(e.resumeAt).getTime());if(!open)return alert('ขณะนี้ปิดการโหวตชั่วคราว');f.major--;e.votes=(e.votes||0)+1;WTS.save(d);alert('โหวตสำเร็จ');render()}document.addEventListener('DOMContentLoaded',render)
</script></body></html>
