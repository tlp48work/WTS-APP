<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Major Vote • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">⌂</a><div class="brand">MAJOR VOTE</div><a href="account.html">●</a></header><section class="balance"><div><div class="value">🪙 <span id="tokenBalance">10</span></div><small>TOKEN</small></div><div><div class="value">⭐ <span id="starBalance">100</span></div><small>STAR</small></div></section><section class="section"><h2 class="section-title">MAJOR VOTE EVENTS</h2><div id="events" class="vote-event-list"></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="major-vote.html" class="active"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script src="wts-core.js"></script><script>
const get=(k,d)=>WTS.get(k,d),set=(k,v)=>WTS.set(k,v);function status(x){if(x.status==='ended')return ['ENDED','ended'];if(x.status==='paused')return ['VOTING PAUSED','paused'];const now=Date.now(),s=new Date(x.start).getTime(),e=new Date(x.end).getTime();if(now<s)return ['NOT OPEN','scheduled'];if(now>e)return ['ENDED','ended'];return ['VOTING OPEN','open']}
function render(){tokenBalance.textContent=localStorage.getItem('wts_token')||10;starBalance.textContent=localStorage.getItem('wts_star')||100;const list=get('wts_major_events_v1',[]);events.innerHTML=list.length?list.map(x=>{const [st,cls]=status(x);return `<article class="vote-event ${cls}">${x.cover?`<img src="${x.cover}" alt="">`:`<div class="vote-cover-placeholder">▣</div>`}<div class="vote-event-body"><span class="vote-status ${cls}">${st}</span><h3>${WTS.esc(x.name)}</h3><p>${new Date(x.start).toLocaleString('th-TH')} — ${new Date(x.end).toLocaleString('th-TH')}</p><button class="primary" ${cls!=='open'?'disabled':''} onclick="vote('${x.id}')">${cls==='open'?'VOTE NOW':'VOTE UNAVAILABLE'}</button></div></article>`}).join(''):'<div class="timeline-empty"><div>▣</div><b>ยังไม่มี Major Vote</b><span>Admin สามารถสร้าง Event ได้จาก ADMIN CENTER</span></div>'}
function vote(id){const me=WTS.session();if(!me)return location.href='login.html?return=major-vote.html';let t=Number(localStorage.getItem('wts_token')||0);if(t<1)return alert('TOKEN ไม่พอ');let n=Math.floor(Number(prompt('จำนวน TOKEN ที่ต้องการใช้','1')));if(!Number.isFinite(n)||n<1||n>t)return alert('จำนวนไม่ถูกต้อง');localStorage.setItem('wts_token',t-n);const d=get('wts_major_votes_v1',{});d[id]=(d[id]||0)+n;set('wts_major_votes_v1',d);render();alert('โหวตสำเร็จ')}
render();setInterval(render,30000);
</script><script src="site-brand.js"></script></body></html>
