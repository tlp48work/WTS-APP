<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Major Vote • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app"><header class="top glass"><a href="index.html">⌂</a><div class="brand">MAJOR VOTE</div><a href="account.html">●</a></header><section class="vote-wallet"><div><small>TOKEN</small><b id="token">0</b></div><div><small>OPEN EVENTS</small><b id="open">0</b></div></section><section class="section"><div class="section-head"><div><span class="eyebrow soft">EVENT CENTER</span><h2>MAJOR VOTE</h2></div></div><div id="events" class="vote-grid"></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a class="active" href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>
(()=>{const K=WTS.K,read=WTS.read,session=WTS.session,change=WTS.changeBalance,esc=WTS.esc,fmt=WTS.fmt;function state(x){const now=Date.now();if(x.manual==='paused'&&x.reopenAt&&Date.now()>=new Date(x.reopenAt).getTime())return 'OPEN';if(x.manual==='paused')return 'PAUSED';if(x.manual==='ended')return 'ENDED';if(x.manual==='open')return 'OPEN';if(now<new Date(x.start).getTime())return 'UPCOMING';if(now>new Date(x.end).getTime())return 'ENDED';return 'OPEN'}function draw(){const s=session(),a=read(K.events,[]),open=a.filter(x=>state(x)==='OPEN');document.getElementById('token').textContent=fmt(s?.token||0);document.getElementById('open').textContent=open.length;document.getElementById('events').innerHTML=a.map(x=>`<article class="vote-card"><div class="vote-cover" style="${x.image?`background-image:linear-gradient(180deg,transparent,rgba(20,15,30,.75)),url('${x.image}')`:''}"><small>${state(x)}</small><b>${esc(x.title)}</b></div><div class="vote-body"><div><span>${esc(x.group||'EDN48 × TLP48')}</span><small>${esc(x.start)} → ${esc(x.end)}</small></div><p>${esc(x.description||'ใช้ TOKEN เพื่อส่งคะแนนให้สมาชิกในอีเวนต์นี้')}</p><button data-vote="${x.id}" ${state(x)!=='OPEN'?'disabled':''}>${state(x)==='OPEN'?'VOTE NOW':state(x)}</button></div></article>`).join('')||'<div class="empty-card">ยังไม่มี Major Vote Event</div>';document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>vote(b.dataset.vote))}function vote(id){const s=session();if(!s)return location.href='login.html?return=major-vote.html';const e=read(K.events,[]).find(x=>x.id===id);if(!e)return;if(Number(s.token||0)<Number(e.cost||1))return alert('TOKEN ไม่พอ');change('token',-Number(e.cost||1));let key=K.events,d=read(key,[]),i=d.findIndex(x=>x.id===id);d[i].total=Number(d[i].total||0)+1;write(key,d);alert('โหวตสำเร็จ ✦');draw()}draw();setInterval(draw,30000)})();</script></body></html>
