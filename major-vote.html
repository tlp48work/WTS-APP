<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Major Vote • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">⌂</a><div class="brand">MAJOR VOTE</div><a href="account.html">●</a></header><section class="balance" id="balance"></section><section class="section"><h2 class="section-title">MAJOR VOTE EVENTS</h2><div id="events" class="vote-event-list"></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="major-vote.html" class="active"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="wts-cloud.js"></script><script src="site-brand.js"></script><script>
const esc=WTSCloud.esc,fmt=n=>Number(n||0).toLocaleString('en-US');
function status(x){if(x.status==='ended')return ['ENDED','ended'];if(x.status==='paused')return ['VOTING PAUSED','paused'];const n=Date.now(),s=new Date(x.start_at).getTime(),e=new Date(x.end_at).getTime();if(n<s)return ['NOT OPEN','scheduled'];if(n>e)return ['ENDED','ended'];return ['VOTING OPEN','open']}
async function render(){const me=await WTSCloud.session();if(me){const w=await WTSCloud.wallet();balance.innerHTML=`<div><div class="value">🪙 <span>${fmt(w.token)}</span></div><small>TOKEN</small></div><div><div class="value">⭐ <span>${fmt(w.star)}</span></div><small>STAR</small></div>`}else balance.innerHTML='<div class="shop-login">Login เพื่อดูยอดและโหวต</div>';const list=await WTSCloud.events();events.innerHTML=list.length?list.map(x=>{const [st,cls]=status(x);return `<article class="vote-event ${cls}">${x.cover_url?`<img src="${esc(x.cover_url)}" alt="">`:`<div class="vote-cover-placeholder">▣</div>`}<div class="vote-event-body"><span class="vote-status ${cls}">${st}</span><h3>${esc(x.name)}</h3><p>${new Date(x.start_at).toLocaleString('th-TH')} — ${new Date(x.end_at).toLocaleString('th-TH')}</p><button class="primary" ${cls!=='open'?'disabled':''} onclick="vote('${x.id}')">${cls==='open'?'VOTE NOW':'VOTE UNAVAILABLE'}</button></div></article>`}).join(''):'<div class="timeline-empty"><div>▣</div><b>ยังไม่มี Major Vote</b><span>Admin สามารถสร้าง Event ได้จาก ADMIN CENTER</span></div>'}
async function vote(id){try{const me=await WTSCloud.session();if(!me){location.href='login.html?return=major-vote.html';return}if(me.role!=='fan'){alert('เฉพาะบัญชีแฟนคลับเท่านั้น');return}const n=prompt('จำนวน TOKEN ที่ต้องการใช้','1');if(n===null)return;await WTSCloud.castVote(id,null,Number(n));alert('โหวตสำเร็จ');render()}catch(e){alert(e.message)}}render();setInterval(render,30000);
</script></body></html>
