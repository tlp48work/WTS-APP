.club{margin-top:20px;padding:38px 24px;border-radius:25px;border:1px solid #ffffff0e;background:linear-gradient(145deg,#1b1730,#0b0e16)}.tlp .club{background:linear-gradient(145deg,#102a38,#091116)}.club h1{font-size:clamp(40px,9vw,70px);margin:7px 0;letter-spacing:-4px}.club p{color:#818a9b}.menus{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.menu{border:1px solid #ffffff0f;background:#ffffff06;border-radius:18px;padding:20px;min-height:135px;text-align:left}.menu b{display:block;margin-top:20px}.menu small{display:block;color:#71798a;font-size:9px;margin-top:5px}.wallet{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.wallet div,.stat{padding:16px;border:1px solid #ffffff0f;background:#ffffff06;border-radius:15px}.wallet small,.stat small{display:block;color:#737c8c;font-size:8px;letter-spacing:2px}.wallet b{font-size:23px;display:block;margin-top:7px}
.vote{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.vcard{border:1px solid #ffffff0e;background:#ffffff05;border-radius:19px;padding:16px}.vcard .avatar{width:58px;height:58px}.vcard h3{margin:12px 0 3px}.vcard p{font-size:9px;color:#777f90}.vcard .primary{width:100%;margin-top:7px}
.music{margin-top:22px;padding:20px;border:1px solid #ffffff0e;border-radius:22px;display:flex;align-items:center;gap:15px}.disc{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#111 0 13%,#b5a6ff 14% 20%,#151721 21%);font-size:25px}.music .grow{flex:1}.music h2{font-size:17px;margin:4px 0}.music p{font-size:9px;color:#777f90}.play{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#111}
.account{margin-top:22px;padding:22px;border:1px solid #ffffff0e;border-radius:22px;display:flex;align-items:center;gap:14px;background:#ffffff05}.profile{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#c7b8ff,#51466e);font-weight:1000;font-size:24px}.account .grow{flex:1}.account h1{font-size:20px;margin:4px 0}.account p{font-size:9px;color:#778091;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.stat b{display:block;font-size:20px;margin:7px 0}.stat span{font-size:8px;color:#727b8c}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:9px 12px;border:1px solid #ffffff10;background:#ffffff06;border-radius:10px;font-size:9px}.empty{padding:22px;border:1px dashed #ffffff14;border-radius:14px;color:#6d7686;font-size:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:75px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#090b12ee;backdrop-filter:blur(20px);border:1px solid #ffffff0e;border-bottom:0;border-radius:20px 20px 0 0}.nav button{border:0;background:transparent;color:#646d7d;font-size:7px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.nav button.on{color:#fff}.nav button.on i{color:#b8a7ff}.tlp .nav button.on i{color:#8ddfff}.modal{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}.login{width:min(420px,100%);background:#10131c;border:1px solid #ffffff18;border-radius:23px;padding:25px}.login input{width:100%;margin-top:9px;background:#070910;border:1px solid #ffffff12;color:#fff;padding:13px;border-radius:11px;outline:0}.login h1{margin:6px 0}.login p,.note{font-size:10px;color:#7b8495;line-height:1.6}.full{width:100%;margin-top:10px}.close{float:right;background:none;border:0;color:#8991a1;font-size:25px}.toast{position:fixed;z-index:80;bottom:92px;left:50%;transform:translateX(-50%);background:#f1eff8;color:#111;padding:11px 16px;border-radius:11px;font-size:10px;font-weight:800;max-width:90%;text-align:center}

<body>
<div id="app">
  <main class="welcome"><div class="welcome-box">
    <div class="mark">W</div>
    <div class="ey">APPLICATION</div>
    <h1>WAY TO <span class="purple">SHINE</span></h1>
    <p class="sub">Your stage. Your star. Your way to shine.</p>
    <div class="carousel" id="groupCarousel">
      <button type="button" class="pick" data-group="TLP48" onclick="setGroup('TLP48')"><b>TLP48</b><span>TULIP ZONE • TAP TO OPEN</span></button>
      <button type="button" class="pick center" data-group="EDN48" onclick="setGroup('EDN48')"><b>EDN48</b><span>EDEN CLUB • TAP TO OPEN</span></button>
      <button type="button" class="pick" data-group="TLP48" onclick="setGroup('TLP48')"><b>TLP48</b><span>TULIP ZONE • TAP TO OPEN</span></button>
    </div>
    <button class="artist" onclick="toast('WAY TO SHINE ARTIST กำลังเตรียมข้อมูล')">WAY TO SHINE ARTIST →</button>
    <div class="hint">แตะการ์ดเพื่อเข้าใช้งาน</div>
  </div></main>
</div>
<script>
const data={
 EDN48:{club:"EDEN CLUB",color:"purple",members:[
  ["Iris","Iris Example",20,"@edn48_iris"],["Mimi","Mimi Example",19,"@edn48_mimi"],["Aira","Aira Example",21,"@edn48_aira"],["Sirin","Sirin Example",18,"@edn48_sirin"]],
 events:[["03 OCT","EDN48 THE 1ST STAGE","EDEN CLUB"],["10 OCT","MEET & GREET","BANGKOK"],["18 OCT","SPARK LIVE","EDEN HALL"]]},
 TLP48:{club:"TULIP ZONE",color:"blue",members:[
  ["Luna","Luna Example",20,"@tlp48_luna"],["Mew","Mew Example",19,"@tlp48_mew"],["Pearl","Pearl Example",21,"@tlp48_pearl"],["Nana","Nana Example",18,"@tlp48_nana"]],
 events:[["05 OCT","TLP48 THE 1ST STAGE","TULIP ZONE"],["12 OCT","TULIP MEET & GREET","BANGKOK"],["24 OCT","TLP48 SPECIAL LIVE","TULIP HALL"]]}
};
let group="EDN48", screen="welcome";
let state={"star":80,"token":1200,"oshi":[],"kami":"","logged":false,"email":""};
try {
  group=localStorage.wtsGroup||"EDN48";
  state=JSON.parse(localStorage.wtsState||JSON.stringify(state));
} catch(e) {}
const $=id=>document.getElementById(id);
function save(){
  try { localStorage.wtsState=JSON.stringify(state); localStorage.wtsGroup=group; } catch(e) {}
}
function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
function setGroup(g){
  group=g;
  save();
  render("home");
  window.scrollTo(0,0);
}
function render(s){
  screen=s;
  let d=data[group];
  document.body.className=group==="TLP48"?"tlp":"";
  $("app").innerHTML=screen==="welcome"?welcome():layout(s,d);
  if(screen==="welcome") initCarousel();
}
function initCarousel(){
  const c=$("groupCarousel");
  if(!c) return;
  const cards=[...c.querySelectorAll(".pick")];
  const update=()=>{
    const center=c.scrollLeft+c.clientWidth/2;
    let best=null, dist=Infinity;
    cards.forEach(card=>{
      const mid=card.offsetLeft+card.offsetWidth/2;
      const d=Math.abs(mid-center);
      if(d<dist){dist=d;best=card}
      card.classList.remove("center");
    });
    if(best) best.classList.add("center");
  };
  c.addEventListener("scroll",update,{passive:true});
  window.onresize=update;
  requestAnimationFrame(()=>{
    const mid=cards[1];
    c.scrollLeft=mid.offsetLeft-(c.clientWidth-mid.offsetWidth)/2;
    update();
  });
}

function welcome(){
  return `<main class="welcome"><div class="welcome-box">
    <div class="mark">W</div>
    <div class="ey">APPLICATION</div>
    <h1>WAY TO <span class="purple">SHINE</span></h1>
    <p class="sub">Your stage. Your star. Your way to shine.</p>
    <div class="carousel" id="groupCarousel">
      <button type="button" class="pick" data-group="TLP48" onclick="setGroup('TLP48')"><b>TLP48</b><span>TULIP ZONE • TAP TO OPEN</span></button>
      <button type="button" class="pick center" data-group="EDN48" onclick="setGroup('EDN48')"><b>EDN48</b><span>EDEN CLUB • TAP TO OPEN</span></button>
      <button type="button" class="pick" data-group="TLP48" onclick="setGroup('TLP48')"><b>TLP48</b><span>TULIP ZONE • TAP TO OPEN</span></button>
    </div>
    <button class="artist" onclick="toast('WAY TO SHINE ARTIST กำลังเตรียมข้อมูล')">WAY TO SHINE ARTIST →</button>
    <div class="hint">ปัดซ้าย–ขวา • การ์ดตรงกลางจะใหญ่ขึ้น • แตะการ์ดเพื่อเข้า</div>
  </div></main>`;
}
function layout(s,d){
  const titles={home:"HOME",members:"MEMBERS",schedule:"SCHEDULE",spark:"SPARK OF THE MONTH",works:"LATEST WORKS",music:"MUSIC AUDIO",club:d.club,vote:"MAJOR VOTE",account:"ACCOUNT"};
  const title=titles[s]||"HOME";
  if(s==="home") return `<div class="top"><button class="mini" onclick="render('welcome')">← BACK</button><div class="top-title"><small>WAY TO SHINE</small><b>${group}</b></div><button class="mini" onclick="toast('${d.club}')">${d.club}</button></div>
  <main class="page">
    <section class="hero"><div><small>${d.club}</small><h1>${group}</h1><p>WELCOME TO ${group} • WAY TO SHINE</p></div><div class="badge">${d.members.length}<br><small>MEMBERS</small></div></section>
    <section class="section"><div class="head"><div><small>EXPLORE</small><h2>MENU</h2></div></div>
      <div class="menus">
        <button class="menu" onclick="render('members')">👥<b>MEMBERS</b><small>สมาชิก • Instagram • อายุ • ข้อมูล</small></button>
        <button class="menu" onclick="render('schedule')">📅<b>SCHEDULE</b><small>ตารางงานและกิจกรรม ${group}</small></button>
        <button class="menu" onclick="render('spark')">✦<b>SPARK OF THE MONTH</b><small>STAR VOTE • ผลแยกตามกลุ่ม</small></button>
        <button class="menu" onclick="render('works')">✧<b>LATEST WORKS</b><small>ผลงานล่าสุดของ ${group}</small></button>
        <button class="menu" onclick="render('music')">♫<b>MUSIC AUDIO</b><small>เพลงและผลงานเสียง</small></button>
        <button class="menu" onclick="render('club')">♢<b>${d.club}</b><small>REDEEM CODE • TOKEN</small></button>
        <button class="menu" onclick="render('vote')">★<b>MAJOR VOTE</b><small>ใช้ STAR เพื่อโหวต</small></button>
        <button class="menu" onclick="render('account')">◉<b>ACCOUNT</b><small>Oshi • Kami Oshi • STAR • TOKEN</small></button>
      </div>
    </section>
  </main>${nav('home')}`;

  let body='';
  if(s==='members') body=`<div class="title"><small>${group}</small><h1>MEMBERS</h1><p>ข้อมูลสมาชิก ${group}</p></div><div class="members">${d.members.map(m=>`<article class="member"><div class="photo"><span>${m[0][0]}</span></div><div class="info"><h2>${m[0]}</h2><p>${m[1]}</p><div class="meta"><span>AGE ${m[2]}</span><span>${m[3]}</span></div><div class="social"><h3>information Social Media</h3><p>Instagram: ${m[3]}</p></div></div></article>`).join('')}</div>`;
  if(s==='schedule') body=`<div class="title"><small>${group}</small><h1>SCHEDULE</h1><p>ตารางงานและกิจกรรม</p></div><div class="cards">${d.events.map(e=>`<article class="event"><b>${e[0]}</b><h3>${e[1]}</h3><p>${e[2]}</p></article>`).join('')}</div>`;
  if(s==='spark') body=`<div class="title"><small>${group}</small><h1>SPARK OF THE MONTH</h1><p>ใช้ STAR เพื่อสนับสนุนสมาชิกในกลุ่มที่เลือก</p></div><div class="club"><h1>✦ ${state.star} STAR</h1><p>STAR ของคุณ</p><button class="primary" onclick="state.star+=10;save();toast('ใช้ STAR สนับสนุนเรียบร้อย')">USE 10 STAR</button></div>`;
  if(s==='works') body=`<div class="title"><small>${group}</small><h1>LATEST WORKS</h1><p>ผลงานล่าสุดของ ${group}</p></div><div class="work"><h2>${group} 1st SINGLE</h2><p>พื้นที่สำหรับเพลง ซิงเกิล MV และผลงานล่าสุด</p><button class="primary" onclick="render('music')">OPEN MUSIC AUDIO</button></div>`;
  if(s==='music') body=`<div class="title"><small>${group}</small><h1>MUSIC AUDIO</h1><p>เพลงและเสียงของ ${group}</p></div><div class="music"><div class="disc">♫</div><div class="grow"><small>${group}</small><h2>WAY TO SHINE MUSIC</h2><p>Music Audio Player</p></div><button class="play" onclick="toast('กำลังเตรียมเครื่องเล่นเพลง')">▶</button></div>`;
  if(s==='club') body=`<div class="title"><small>${group}</small><h1>${d.club}</h1><p>ระบบสมาชิกและสิทธิพิเศษ</p></div><div class="club"><h1>${d.club}</h1><p>Redeem Code และระบบ TOKEN</p><div class="wallet"><div><small>TOKEN</small><b>${state.token}</b></div><div><small>STAR</small><b>${state.star}</b></div></div><button class="primary full" onclick="let c=prompt('ใส่ REDEEM CODE');if(c){state.token+=100;save();render('club');toast('ได้รับ 100 TOKEN')}">REDEEM CODE</button></div>`;
  if(s==='vote') body=`<div class="title"><small>${group}</small><h1>MAJOR VOTE</h1><p>โหวตด้วย STAR</p></div><div class="vote">${d.members.map(m=>`<div class="vcard"><div class="avatar">${m[0][0]}</div><h3>${m[0]}</h3><p>STAR VOTE</p><button class="primary" onclick="if(state.star>=1){state.star--;save();toast('โหวตให้ ${m[0]} แล้ว')}else toast('STAR ไม่พอ')">VOTE 1 STAR</button></div>`).join('')}</div>`;
  if(s==='account') body=`<div class="title"><small>WAY TO SHINE</small><h1>ACCOUNT</h1><p>บัญชีของคุณ</p></div><div class="account"><div class="profile">W</div><div class="grow"><h1>WAY TO SHINE MEMBER</h1><p>${state.logged?state.email:'Guest Account'}</p></div><button class="primary" onclick="toast('ระบบ Login จะเปิดใช้งานภายหลัง')">LOGIN</button></div><div class="stats"><div class="stat"><small>OSHI</small><b>${state.oshi.length}</b><span>คน</span></div><div class="stat"><small>KAMI OSHI</small><b>${state.kami||'-'}</b><span>สมาชิก</span></div><div class="stat"><small>TOKEN</small><b>${state.token}</b><span>balance</span></div><div class="stat"><small>STAR</small><b>${state.star}</b><span>balance</span></div></div>`;
  return `<div class="top"><button class="mini" onclick="render('home')">← MENU</button><div class="top-title"><small>${group}</small><b>${title}</b></div><button class="mini" onclick="render('account')">ACCOUNT</button></div><main class="page">${body}</main>${nav(s)}`;
}
function nav(active){return `<nav class="nav"><button class="${active==='home'?'on':''}" onclick="render('home')"><i>⌂</i>HOME</button><button class="${active==='members'?'on':''}" onclick="render('members')"><i>♙</i>MEMBERS</button><button class="${active==='club'?'on':''}" onclick="render('club')"><i>◇</i>${group==='EDN48'?'EDEN':'TULIP'}</button><button class="${active==='music'?'on':''}" onclick="render('music')"><i>♫</i>MUSIC</button><button class="${active==='account'?'on':''}" onclick="render('account')"><i>◉</i>ACCOUNT</button></nav>`}

try { render("welcome"); } catch(e) {
  console.error(e);
}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body>
</html>
