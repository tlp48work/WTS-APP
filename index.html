<style>

button{color:inherit}.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.welcome-box{width:min(900px,100%)}.logo{font-weight:1000;font-size:22px;letter-spacing:-2px}.mark{width:68px;height:68px;border:1px solid #ffffff22;border-radius:22px;display:grid;place-items:center;margin:0 auto 18px;background:#ffffff0b;font-size:28px;font-weight:1000}.ey{font-size:10px;letter-spacing:3px;color:#8d95a7;font-weight:800}.welcome h1{font-size:clamp(45px,9vw,80px);margin:8px 0;letter-spacing:-5px}.purple{color:#b39cff}.blue{color:#93ddff}.sub{color:#858d9e;margin:0 0 36px}.carousel{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0}.pick{border:1px solid #ffffff15;border-radius:26px;background:#11141e;min-height:140px;padding:28px;text-align:left;min-width:170px;opacity:.4;transform:scale(.82)}.pick.main{opacity:1;transform:scale(1);min-width:min(520px,82vw);min-height:230px;background:linear-gradient(145deg,#1b1830,#0c0f18);border-color:#b39cff44}.tlp .pick.main{background:linear-gradient(145deg,#112a38,#0c1218);border-color:#8bdfff44}.pick b{font-size:42px;display:block;letter-spacing:-2px}.pick span{font-size:11px;color:#80899a}.artist{border:0;background:#f2f1f7;color:#101117;border-radius:15px;padding:16px 20px;width:min(520px,90%);font-weight:900}.hint{font-size:10px;color:#555e70;margin-top:12px}
.top{height:68px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#070910dd;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0b}.top-title{text-align:center}.top-title small{display:block;color:#71798a;font-size:8px;letter-spacing:2px}.top-title b{font-size:13px}.mini{border:1px solid #ffffff12;background:#ffffff08;border-radius:11px;padding:8px 10px;font-size:9px;font-weight:800}.switch{display:flex;width:max-content;margin:12px auto 0;padding:4px;background:#ffffff07;border:1px solid #ffffff0c;border-radius:12px}.switch button{border:0;background:transparent;padding:8px 18px;border-radius:8px;color:#71798a;font-size:10px;font-weight:900}.switch .sel{background:#ffffff13;color:#fff}
.page{width:min(1080px,100%);margin:auto;padding:16px 15px 105px}.hero{min-height:310px;border-radius:28px;padding:28px;display:flex;align-items:end;justify-content:space-between;background:linear-gradient(120deg,#18142a,#0a0d15);border:1px solid #ffffff0f;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 25%,#ad99ff2b,transparent 38%)}.tlp .hero{background:linear-gradient(120deg,#102a39,#090f14)}.tlp .hero:after{background:radial-gradient(circle at 80% 25%,#7bdcff2b,transparent 38%)}.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(34px,7vw,62px);letter-spacing:-4px;margin:9px 0 5px}.hero p{color:#929aaa;margin:0}.badge{border:1px solid #ffffff15;background:#ffffff08;padding:17px;border-radius:17px;text-align:center;font-weight:900}.section{margin-top:36px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.head h2{font-size:23px;margin:5px 0 0;letter-spacing:-1px}.head button{background:none;border:0;color:#b7a7ff;font-size:9px;font-weight:900}.tlp .head button{color:#8edfff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.event{border:1px solid #ffffff10;background:#ffffff06;border-radius:17px;padding:16px;min-height:105px}.event b{color:#b9a8ff;font-size:11px}.tlp .event b{color:#8edfff}.event h3{font-size:12px;margin:12px 0 5px}.event p{color:#6f7889;font-size:9px;margin:0}.list{border:1px solid #ffffff0d;border-radius:18px;overflow:hidden}.row{display:flex;align-items:center;gap:11px;padding:13px;border-bottom:1px solid #ffffff08}.row:last-child{border:0}.avatar{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#c5b6ff,#4d426d);font-weight:900}.tlp .avatar{background:linear-gradient(145deg,#a0e4ff,#426b7d)}.row .grow{flex:1}.row small{display:block;color:#747d8e;font-size:8px;margin-top:3px}.work{padding:25px;border:1px solid #ffffff0e;border-radius:22px;background:#ffffff05}.work h2{font-size:30px;margin:7px 0}.work p{color:#7f8797;font-size:11px}.primary{border:1px solid #b8a8ff55;background:#f0edff;color:#111;border-radius:11px;padding:11px 15px;font-size:10px;font-weight:900}.tlp .primary{border-color:#8bdfff55}
.title{margin-top:26px}.title h1{font-size:40px;margin:7px 0;letter-spacing:-3px}.title p{color:#808899;font-size:11px}.members{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:22px}.member{border:1px solid #ffffff0e;border-radius:21px;overflow:hidden;background:#ffffff05}.photo{height:205px;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#c1b0ff55,transparent 55%)}.tlp .photo{background:radial-gradient(circle at 50% 25%,#8de1ff55,transparent 55%)}.photo span{width:88px;height:88px;border-radius:50%;border:1px solid #fff3;background:#ffffff10;display:grid;place-items:center;font-size:35px;font-weight:1000}.info{padding:16px}.info h2{margin:0;font-size:23px}.info p{color:#777f90;font-size:10px;margin:4px 0 13px}.meta{display:flex;justify-content:space-between;font-size:8px;color:#a2a9b7}.actions{display:flex;gap:7px;margin-top:13px}.actions button{flex:1;border:1px solid #ffffff12;background:#ffffff07;border-radius:9px;padding:9px;font-size:8px;font-weight:900}.social{margin-top:14px;padding:18px;border:1px solid #ffffff0d;border-radius:17px}.social h3{font-size:11px;margin:0}.social p{font-size:10px;color:#737c8d}
.club{margin-top:20px;padding:38px 24px;border-radius:25px;border:1px solid #ffffff0e;background:linear-gradient(145deg,#1b1730,#0b0e16)}.tlp .club{background:linear-gradient(145deg,#102a38,#091116)}.club h1{font-size:clamp(40px,9vw,70px);margin:7px 0;letter-spacing:-4px}.club p{color:#818a9b}.menus{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.menu{border:1px solid #ffffff0f;background:#ffffff06;border-radius:18px;padding:20px;min-height:135px;text-align:left}.menu b{display:block;margin-top:20px}.menu small{display:block;color:#71798a;font-size:9px;margin-top:5px}.wallet{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.wallet div,.stat{padding:16px;border:1px solid #ffffff0f;background:#ffffff06;border-radius:15px}.wallet small,.stat small{display:block;color:#737c8c;font-size:8px;letter-spacing:2px}.wallet b{font-size:23px;display:block;margin-top:7px}
.vote{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.vcard{border:1px solid #ffffff0e;background:#ffffff05;border-radius:19px;padding:16px}.vcard .avatar{width:58px;height:58px}.vcard h3{margin:12px 0 3px}.vcard p{font-size:9px;color:#777f90}.vcard .primary{width:100%;margin-top:7px}
.music{margin-top:22px;padding:20px;border:1px solid #ffffff0e;border-radius:22px;display:flex;align-items:center;gap:15px}.disc{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#111 0 13%,#b5a6ff 14% 20%,#151721 21%);font-size:25px}.music .grow{flex:1}.music h2{font-size:17px;margin:4px 0}.music p{font-size:9px;color:#777f90}.play{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#111}
.account{margin-top:22px;padding:22px;border:1px solid #ffffff0e;border-radius:22px;display:flex;align-items:center;gap:14px;background:#ffffff05}.profile{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#c7b8ff,#51466e);font-weight:1000;font-size:24px}.account .grow{flex:1}.account h1{font-size:20px;margin:4px 0}.account p{font-size:9px;color:#778091;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.stat b{display:block;font-size:20px;margin:7px 0}.stat span{font-size:8px;color:#727b8c}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:9px 12px;border:1px solid #ffffff10;background:#ffffff06;border-radius:10px;font-size:9px}.empty{padding:22px;border:1px dashed #ffffff14;border-radius:14px;color:#6d7686;font-size:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:75px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#090b12ee;backdrop-filter:blur(20px);border:1px solid #ffffff0e;border-bottom:0;border-radius:20px 20px 0 0}.nav button{border:0;background:transparent;color:#646d7d;font-size:7px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.nav button.on{color:#fff}.nav button.on i{color:#b8a7ff}.tlp .nav button.on i{color:#8ddfff}.modal{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}.login{width:min(420px,100%);background:#10131c;border:1px solid #ffffff18;border-radius:23px;padding:25px}.login input{width:100%;margin-top:9px;background:#070910;border:1px solid #ffffff12;color:#fff;padding:13px;border-radius:11px;outline:0}.login h1{margin:6px 0}.login p,.note{font-size:10px;color:#7b8495;line-height:1.6}.full{width:100%;margin-top:10px}.close{float:right;background:none;border:0;color:#8991a1;font-size:25px}.toast{position:fixed;z-index:80;bottom:92px;left:50%;transform:translateX(-50%);background:#f1eff8;color:#111;padding:11px 16px;border-radius:11px;font-size:10px;font-weight:800;max-width:90%;text-align:center}
@media(max-width:700px){.cards{grid-template-columns:1fr}.members{grid-template-columns:1fr}.vote{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.badge{display:none}.hero{min-height:300px}.menus{grid-template-columns:1fr 1fr}.pick:not(.main){display:none}}
@media(max-width:430px){
  .menus{grid-template-columns:1fr}

  .carousel{
    justify-content:flex-start;
    overflow-x:auto;

    scroll-snap-type:x mandatory;

<body>
<div id="app">
  <main class="welcome"><div class="welcome-box">
    <div class="mark">W</div>
    <div class="ey">APPLICATION</div>
    <h1>WAY TO <span class="purple">SHINE</span></h1>
    <p class="sub">Your stage. Your star. Your way to shine.</p>
    <div class="carousel">
      <a class="pick linkpick" href="#tlp48" onclick="setGroup('TLP48');return false"><b>TLP48</b><span>TULIP ZONE</span></a>
      <a class="pick main linkpick" href="#edn48" onclick="setGroup('EDN48');return false"><b>EDN48</b><span>EDEN CLUB</span></a>
    </div>
    <button class="artist" onclick="toast('WAY TO SHINE ARTIST กำลังเตรียมข้อมูล')">WAY TO SHINE ARTIST →</button>
    <div class="hint">แตะการ์ดเพื่อเข้าใช้งาน</div>
  </div></main>
</div>
<script>
const data={
 EDN48:{club:"EDEN CLUB",color:"purple",members:[
  ["Iris","Iris Example",20,"@edn48_iris"],["Mimi","Mimi Example",19,"@edn48_mimi"],["Aira","Aira Example",21,"@edn48_aira"],["Sirin","Sirin Example",18,"@edn48_sirin"]],
 events:[["03 OCT","EDN48 THE 1ST STAGE","EDEN CLUB"],["10 OCT","MEET & GREET","BANGKOK"],["18 OCT","SPARK LIVE","EDEN HALL"]]},
 TLP48:{club:"TULIP ZONE",color:"blue",members:[
  ["Luna","Luna Example",20,"@tlp48_luna"],["Mew","Mew Example",19,"@tlp48_mew"],["Pearl","Pearl Example",21,"@tlp48_pearl"],["Nana","Nana Example",18,"@tlp48_nana"]],
 events:[["05 OCT","TLP48 THE 1ST STAGE","TULIP ZONE"],["12 OCT","TULIP MEET & GREET","BANGKOK"],["24 OCT","TLP48 SPECIAL LIVE","TULIP HALL"]]}
};
let group="EDN48", screen="welcome";
let state={"star":80,"token":1200,"oshi":[],"kami":"","logged":false,"email":""};
try {
  group=localStorage.wtsGroup||"EDN48";
  state=JSON.parse(localStorage.wtsState||JSON.stringify(state));
} catch(e) {}
const $=id=>document.getElementById(id);
function save(){
  try { localStorage.wtsState=JSON.stringify(state); localStorage.wtsGroup=group; } catch(e) {}
}
function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
function setGroup(g){
  group=g;
  save();
  try { render("home"); } catch(e) {
    console.error(e);
    $("app").innerHTML = '<main class="welcome"><div class="welcome-box"><h1>WAY TO SHINE</h1><p>กำลังเปิด '+g+'...</p><button class="artist" onclick="location.reload()">RELOAD</button></div></main>';
  }
  window.scrollTo(0,0);
}
function render(s){screen=s;let d=data[group];document.body.className=group==="TLP48"?"tlp":"";$("app").innerHTML=screen==="welcome"?welcome():layout(s,d)}
function welcome(){return `<main class="welcome"><div class="welcome-box"><div class="mark">W</div><div class="ey">APPLICATION</div><h1>WAY TO <span class="purple">SHINE</span></h1><p class="sub">Your stage. Your star. Your way to shine.</p><div class="carousel"><a class="pick linkpick" href="#tlp48" onclick="setGroup('TLP48');return false"><b>TLP48</b><span>TULIP ZONE</span></a><a class="pick main linkpick" href="#edn48" onclick="setGroup('EDN48');return false"><b>EDN48</b><span>EDEN CLUB</span></a><a class="pick linkpick" href="#tlp48" onclick="setGroup('TLP48');return false"><b>TLP48</b><span>TULIP ZONE</span></a></div><button class="artist" onclick="toast('WAY TO SHINE ARTIST กำลังเตรียมข้อมูล')">WAY TO SHINE ARTIST →</button><div class="hint">แตะการ์ดเพื่อเข้าใช้งาน</div></div></main>`}
function top(){return `<header class="top"><button class="mini" onclick="render('welcome')">WTS</button><div class="top-title"><small>WAY TO SHINE</small><b>${group}</b></div><button class="mini" onclick="render('account')">◉ ${state.logged?'ACCOUNT':'LOGIN'}</button></header><div class="switch"><button class="${group==='EDN48'?'sel':''}" onclick="setGroup('EDN48')">EDN48</button><button class="${group==='TLP48'?'sel':''}" onclick="setGroup('TLP48')">TLP48</button></div>`}
function nav(s){return `<nav class="nav"><button class="${s==='home'?'on':''}" onclick="render('home')"><i>⌂</i>HOME</button><button class="${s==='members'?'on':''}" onclick="render('members')"><i>♙</i>MEMBERS</button><button class="${s==='club'?'on':''}" onclick="render('club')"><i>✦</i>${data[group].club}</button><button class="${s==='music'?'on':''}" onclick="render('music')"><i>♫</i>MUSIC</button><button class="${s==='account'?'on':''}" onclick="render('account')"><i>◉</i>ACCOUNT</button></nav>`}
function layout(s,d){let body=s==='home'?home(d):s==='members'?members(d):s==='club'?club(d):s==='vote'?vote(d):s==='music'?music():account();return top()+`<div class="page">${body}</div>${nav(s)}`}
function home(d){return `<section class="hero"><div><span class="ey">OFFICIAL APPLICATION</span><h1>WELCOME TO ${group==='EDN48'?'EDEN':'TULIP'}</h1><p>${group==='EDN48'?'A place where every dream can shine.':'Together, we bloom and shine.'}</p></div><div class="badge">${group}<br><small>WAY TO SHINE</small></div></section><section class="section"><div class="head"><div><span class="ey">UPCOMING</span><h2>SCHEDULE</h2></div></div><div class="cards">${d.events.map(e=>`<article class="event"><b>${e[0]}</b><h3>${e[1]}</h3><p>${e[2]}</p></article>`).join("")}</div></section><section class="section"><div class="head"><div><span class="ey">MONTHLY PROJECT</span><h2>SPARK OF THE MONTH</h2></div><button onclick="render('vote')">VOTE →</button></div><div class="list">${d.members.map((m,i)=>`<div class="row"><span>${i+1}</span><span class="avatar">${m[0][0]}</span><div class="grow"><b>${m[0]}</b><small>${group}</small></div><strong>${(12480-i*850).toLocaleString()} <small>VOTES</small></strong></div>`).join("")}</div></section><section class="section work"><span class="ey">LATEST WORK</span><h2>${group} 1ST SINGLE</h2><p>ผลงานล่าสุดของวง • จบ • END</p><button class="primary" onclick="render('music')">MUSIC AUDIO →</button></section>`}
function members(d){return `<section class="title"><span class="ey">THE MEMBERS</span><h1>${group}</h1><p>สมาชิก • อายุ • ชื่อจริง • Instagram</p></section><div class="members">${d.members.map(m=>`<article class="member"><div class="photo"><span>${m[0][0]}</span></div><div class="info"><h2>${m[0]}</h2><p>${m[1]}</p><div class="meta"><span>${m[2]} YEARS</span><span>${m[3]}</span></div><div class="actions"><button onclick="oshi('${m[0]}')">${state.oshi.includes(m[0])?'★ OSHI':'☆ OSHI'}</button><button onclick="kami('${m[0]}')">KAMI OSHI</button></div></div></article>`).join("")}</div><div class="social"><h3>INFORMATION / SOCIAL MEDIA</h3><p>Official Website • Instagram • X • YouTube • TikTok • Facebook</p></div>`}
function club(d){return `<section class="club"><span class="ey">${group} MEMBERSHIP</span><h1>${d.club}</h1><p>พื้นที่พิเศษสำหรับแฟน ๆ ของ ${group}</p></section><div class="menus"><button class="menu" onclick="toast('เปิด REDEEM CODE')">⌁<b>REDEEM CODE</b><small>แลกรหัสสิทธิพิเศษ</small></button><button class="menu" onclick="render('vote')">★<b>MAJOR VOTE</b><small>ใช้ STAR เพื่อสนับสนุนสมาชิก</small></button><button class="menu" onclick="toast('TOKEN SHOP กำลังเตรียมเปิด')">◇<b>TOKEN SHOP</b><small>ซื้อของและไอเทมต่าง ๆ</small></button><button class="menu" onclick="toast('MEMBERSHIP กำลังอัปเดต')">✦<b>MEMBERSHIP</b><small>สิทธิพิเศษของสมาชิก</small></button></div><div class="wallet"><div><small>STAR</small><b>★ ${state.star}</b></div><div><small>TOKEN</small><b>◇ ${state.token.toLocaleString()}</b></div></div>`}
function vote(d){return `<section class="title"><span class="ey">MONTHLY RANKING</span><h1>SPARK OF THE MONTH</h1><p>ใช้ 10 STAR ต่อการโหวต 1 ครั้ง</p></section><div class="vote">${d.members.map((m,i)=>`<article class="vcard"><div class="avatar">${m[0][0]}</div><h3>${m[0]}</h3><p>${(12480-i*850).toLocaleString()} votes</p><button class="primary" onclick="voteOne()">★ VOTE 10 STAR</button></article>`).join("")}</div>`}
function music(){return `<section class="title"><span class="ey">MUSIC</span><h1>${group} 1ST SINGLE</h1><p>จบ • END</p></section><div class="music"><div class="disc">♪</div><div class="grow"><span class="ey">NOW PLAYING</span><h2>${group} — 1st Single</h2><p>Audio player พร้อมเชื่อมไฟล์เพลงจริง</p></div><button class="play" onclick="toast('ยังไม่ได้อัปโหลดไฟล์เสียง')">▶</button></div>`}
function account(){return `<section class="account"><div class="profile">W</div><div class="grow"><span class="ey">MY ACCOUNT</span><h1>${state.logged?(state.email||'SHINE USER'):'GUEST'}</h1><p>${state.logged?'บัญชีพร้อมใช้งาน':'เข้าสู่ระบบเพื่อบันทึกข้อมูล'}</p></div>${state.logged?'<button class="primary" onclick="logout()">LOG OUT</button>':'<button class="primary" onclick="login()">LOGIN</button>'}</section><div class="stats"><div class="stat"><small>OSHI</small><b>${state.oshi.length}</b><span>คน</span></div><div class="stat"><small>KAMI OSHI</small><b>${state.kami||'—'}</b><span>สมาชิก</span></div><div class="stat"><small>TOKEN</small><b>${state.token}</b><span>เหรียญ</span></div><div class="stat"><small>STAR</small><b>★ ${state.star}</b><span>คะแนน</span></div></div><section class="section"><div class="head"><div><span class="ey">YOUR OSHI</span><h2>OSHI LIST</h2></div></div>${state.oshi.length?'<div class="chips">'+state.oshi.map(x=>`<span class="chip">★ ${x}</span>`).join("")+'</div>':'<div class="empty">ยังไม่มี Oshi — ไปที่ Members เพื่อเลือกสมาชิก</div>'}</section>`}
function oshi(n){if(state.oshi.includes(n))state.oshi=state.oshi.filter(x=>x!==n);else state.oshi.push(n);save();render('members');toast('อัปเดต Oshi แล้ว')}
function kami(n){state.kami=n;save();toast(n+' เป็น Kami Oshi แล้ว')}
function voteOne(){if(state.star<10)return toast('STAR ไม่พอ');state.star-=10;save();toast('โหวตสำเร็จ ใช้ 10 STAR')}
function login(){let email=prompt('Email / Username');if(email){state.email=email;state.logged=true;save();render('account');toast('เข้าสู่ระบบสำเร็จ')}}
function logout(){state.logged=false;state.email='';save();render('account');toast('ออกจากระบบแล้ว')}
window.addEventListener('error', function(e){
  console.error(e.error || e.message);
});
try { render('welcome'); } catch(e) {
  console.error(e);
}
</script>
