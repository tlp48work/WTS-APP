<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div></header><section class="auth-wrap"><div class="auth-card"><h1>Welcome back ✦</h1><p style="color:#888">เข้าสู่ระบบสมาชิก</p><div class="field"><label>USERNAME / EMAIL</label><input id="user" placeholder="ชื่อผู้ใช้หรืออีเมล"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" placeholder="รหัสผ่าน"></div><button class="primary fullbtn" onclick="login()">LOGIN</button><div class="switch-auth">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></div></div></section></main><script>function login(){const u=document.getElementById('user').value.trim();if(!u){alert('กรุณากรอก Username');return}localStorage.setItem('wts_user',u);location.href='account.html'}</script></body></html>
