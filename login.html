<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div><span>✦</span></header><form class="form-card" id="loginForm"><div class="login-badge">✦</div><h1>LOGIN</h1><p class="muted">Fan และ Member ใช้หน้า Login เดียวกัน</p><div class="field"><label>EMAIL หรือ MEMBER USERNAME</label><input id="identifier" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" id="submitBtn">LOGIN</button><p id="msg" class="form-msg"></p><p style="text-align:center">ยังไม่มีบัญชีแฟนคลับ? <a href="register.html" class="cute-link">สมัครสมาชิก</a></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="wts-cloud.js"></script><script src="site-brand.js"></script><script>loginForm.onsubmit=async e=>{e.preventDefault();msg.textContent='กำลังเข้าสู่ระบบ…';submitBtn.disabled=true;try{await WTSCloud.signIn(identifier.value,password.value);const q=new URLSearchParams(location.search);location.href=q.get('return')||'account.html'}catch(err){msg.textContent=err.message||'Login ไม่สำเร็จ'}finally{submitBtn.disabled=false}};</script></body></html>
