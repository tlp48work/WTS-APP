<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div></header><form class="form-card" onsubmit="go(event)"><h1>LOGIN</h1><div class="field"><label>USERNAME / EMAIL</label><input id="u" required></div><div class="field"><label>PASSWORD</label><input type="password" required></div><button class="primary">LOGIN</button><p style="text-align:center">ยังไม่มีบัญชี? <a href="register.html" style="color:#d85b86;font-weight:800">สมัครสมาชิก</a></p></form></main><script>function go(e){e.preventDefault();localStorage.setItem('wts_logged',1);localStorage.setItem('wts_username',u.value);localStorage.setItem('wts_token',localStorage.getItem('wts_token')||10);location.href='account.html'}</script></body></html>
