<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app auth-page"><header class="top glass"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div></header><form class="auth-card" id="form"><div class="auth-logo">✦</div><span class="eyebrow">WELCOME BACK</span><h1>LOGIN</h1><p>แฟนคลับและสมาชิกใช้หน้า Login เดียวกัน</p><label>USERNAME<input id="u" autocomplete="username" required></label><label>PASSWORD<input id="pw" type="password" autocomplete="current-password" required></label><button class="primary">ENTER MY SPACE</button><div id="msg" class="form-msg"></div><a href="register.html">ยังไม่มีบัญชีแฟนคลับ? <b>สมัครสมาชิก</b></a><small>Member Account จะถูกสร้างโดย Admin และเข้า Account เดียวกันได้ทันที</small></form></main><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();const u=document.getElementById('u').value.trim(),p=document.getElementById('pw').value;let m=WTS.read(WTS.K.accounts,[]).find(x=>x.username===u&&x.password===p);let f=WTS.read(WTS.K.fan,[]).find(x=>(x.username===u||x.email===u)&&x.password===p);if(m){m.type='member';WTS.login(m);location.href=new URLSearchParams(location.search).get('return')||'account.html'}else if(f){f.type='fan';WTS.login(f);location.href=new URLSearchParams(location.search).get('return')||'account.html'}else document.getElementById('msg').textContent='Username หรือ Password ไม่ถูกต้อง ✦'};</script></body></html>
