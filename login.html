<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div><span>✦</span></header><form class="form-card" onsubmit="go(event)"><div class="login-badge">✦</div><h1>LOGIN</h1><p class="muted">แฟนคลับและสมาชิก EDN48 / TLP48 ใช้หน้า Login เดียวกัน</p><div class="field"><label>USERNAME / EMAIL</label><input id="u" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="p" type="password" autocomplete="current-password" required></div><button class="primary">LOGIN</button><p id="msg" class="form-msg"></p><p style="text-align:center">ยังไม่มีบัญชีแฟนคลับ? <a href="register.html" class="cute-link">สมัครสมาชิก</a></p></form></main><script>
function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function go(e){e.preventDefault();const user=u.value.trim(),pass=p.value;const members=get('wts_member_accounts_v1',[]),fans=get('wts_fan_accounts_v1',[]);const m=members.find(x=>(x.username===user||x.email===user)&&x.password===pass);const f=fans.find(x=>(x.username===user||x.email===user)&&x.password===pass);const a=m||f;if(!a){msg.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return}localStorage.setItem('wts_logged','1');localStorage.setItem('wts_session_type',m?'member':'fan');localStorage.setItem('wts_session_user',a.username);localStorage.setItem('wts_username',a.name);localStorage.setItem('wts_token',localStorage.getItem('wts_token')||'10');if(!localStorage.getItem('wts_star'))localStorage.setItem('wts_star','100');const q=new URLSearchParams(location.search);location.href=q.get('return')||'account.html'}
</script><script src="wts-core.js"></script><script src="site-brand.js"></script></body></html>
