<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body><main class="page "><header class="top"><div class="topin"><a class="brand" href="index.html">← WAY TO SHINE</a><a class="icon" href="account.html">👤</a></div></header><main class="login"><div class="loginbox"><h1>WAY TO SHINE</h1><p>เข้าสู่ระบบสมาชิก</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="formbtn" onclick="go()">LOGIN</button><p id="msg" class="small"></p><a class="btn" href="register.html">สมัครสมาชิก</a><a class="btn" href="index.html">กลับหน้าหลัก</a><p class="small">Demo: บัญชีเก็บในเครื่องด้วย localStorage ยังไม่ใช่ระบบออนไลน์จริง</p></div></main></main><script src="app.js"></script></body></html><script>function go(){let users=JSON.parse(localStorage.getItem("wts_users")||"{}"),u=users[email.value];if(!u)return msg.textContent="ไม่พบบัญชีนี้";if(u.password!==pass.value)return msg.textContent="Password ไม่ถูกต้อง";save(u);location.href="account.html"}</script>
