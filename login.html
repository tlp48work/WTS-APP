<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="wts-app.js"></script></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand" data-wts-brand>WAY TO SHINE</div></header><section class="form-card login-card"><div class="login-mark">✦</div><h1>เข้าสู่ระบบ</h1><p class="muted">แฟนคลับและเมมเบอร์ใช้หน้า Login เดียวกัน</p><form id="loginForm"><div class="field"><label>USERNAME</label><input id="u" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="p" type="password" autocomplete="current-password" required></div><button class="primary">LOGIN</button><p id="msg" class="form-msg"></p></form><div class="login-hint"><b>MEMBER</b><span>ใช้รหัสที่ Admin สร้างให้</span><b>FAN CLUB</b><span>สมัครบัญชีใหม่ได้จากด้านล่าง</span></div><a class="outline-btn" href="register.html">CREATE FAN ACCOUNT</a></section></main><script>
const ADMIN='WTS-ADMIN-2026';document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;const d=WTS.load();if(u.toUpperCase()==='ADMIN'&&p===ADMIN){WTS.setUser({id:'admin',role:'admin',name:'ADMIN'});location.href='admin.html';return}const m=d.members.find(x=>x.username===u&&x.password===p);if(m){WTS.setUser({id:m.id,role:'member',name:m.name,memberId:m.id,group:m.group});go();return}const f=d.fans.find(x=>x.username===u&&x.password===p);if(f){WTS.setUser({id:f.id,role:'fan',name:f.name});go();return}document.getElementById('msg').textContent='Username หรือ Password ไม่ถูกต้อง';};function go(){const q=new URLSearchParams(location.search);location.href=q.get('return')||'account.html'}
</script></body></html>
