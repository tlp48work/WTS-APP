<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div><span>✦</span></header><section class="login-choice"><div class="login-logo">✦</div><h1>WELCOME BACK</h1><p>เข้าสู่บัญชีของคุณเพื่อใช้งาน MY ACCOUNT</p></section><form class="form-card login-form" onsubmit="go(event)"><div class="field"><label>USERNAME / EMAIL</label><input id="u" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="p" type="password" autocomplete="current-password" required></div><button class="primary">LOGIN</button><p id="msg" class="form-msg"></p><p class="login-note">บัญชีสมาชิกและบัญชีแฟนคลับเข้าสู่ระบบผ่านหน้านี้เหมือนกัน</p><p style="text-align:center">ยังไม่มีบัญชีแฟนคลับ? <a href="register.html">สมัครสมาชิก</a></p></form></main><script>
const ACC='wts_member_accounts_v1', FAN='wts_fan_accounts_v1';
function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function go(e){e.preventDefault();const username=u.value.trim(),password=p.value;const members=get(ACC,[]),fans=get(FAN,[]);const m=members.find(x=>(x.username===username||x.email===username)&&x.password===password);if(m){localStorage.setItem('wts_session_v2',JSON.stringify({role:'member',username:m.username}));localStorage.setItem('wts_member_session',m.username);localStorage.setItem('wts_logged','1');localStorage.setItem('wts_username',m.name);const q=new URLSearchParams(location.search);location.href=q.get('return')||'account.html';return}const f=fans.find(x=>(x.username===username||x.email===username)&&x.password===password);if(f){localStorage.setItem('wts_session_v2',JSON.stringify({role:'fan',username:f.username}));localStorage.setItem('wts_logged','1');localStorage.setItem('wts_username',f.name);const q=new URLSearchParams(location.search);location.href=q.get('return')||'account.html';return}msg.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'}
</script></body></html>
