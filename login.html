<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app login-page"><header class="top"><a href="index.html">‹</a><div class="brand" data-app-name>WAY TO SHINE</div></header><section class="login-shell"><div class="login-mark" data-logo>✦</div><h1>WELCOME BACK</h1><p>แฟนคลับและสมาชิกใช้หน้า Login เดียวกัน</p><form class="form-card login-card" onsubmit="go(event)"><div class="field"><label>USERNAME</label><input id="u" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="p" type="password" autocomplete="current-password" required></div><button class="primary wide">LOGIN</button><div id="err" class="login-error"></div></form><div class="login-note">บัญชีแฟนคลับและบัญชีสมาชิกจะถูกสร้างโดย Admin เท่านั้น</div><a class="admin-login-link" href="admin.html">ADMIN PANEL</a></section></main><script src="app.js"></script><script>function go(e){e.preventDefault();if(!WTS.login(u.value.trim(),p.value)){err.textContent='USERNAME หรือ PASSWORD ไม่ถูกต้อง';return}const q=new URLSearchParams(location.search);location.href=q.get('return')||'account.html'}</script></body></html>
