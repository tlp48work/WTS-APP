<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div><span>✦</span></header><form class="form-card unified-login" id="loginForm"><div class="login-logo">✦</div><h1>LOGIN</h1><p class="muted">แฟนคลับและสมาชิกใช้หน้า Login เดียวกัน</p><div class="field"><label>USERNAME / EMAIL</label><input id="u" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="pw" type="password" autocomplete="current-password" required></div><button class="primary">LOGIN</button><p id="msg" class="form-msg"></p><p style="text-align:center">ยังไม่มีบัญชีแฟนคลับ? <a href="register.html" class="pink-link">สมัครสมาชิก</a></p><p class="login-note">Member Account จะถูกสร้างโดย Admin และใช้ Login นี้ได้ทันที</p></form></main><script>
const ACC='wts_member_accounts_v1',FAN='wts_fan_accounts_v1';const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const user=u.value.trim(),pass=pw.value;const m=get(ACC,[]).find(x=>x.username===user&&x.password===pass);if(m){localStorage.setItem('wts_member_session',m.username);localStorage.removeItem('wts_fan_session');localStorage.setItem('wts_logged','1');localStorage.setItem('wts_username',m.name);location.href=new URLSearchParams(location.search).get('return')||'account.html';return}const f=get(FAN,[]).find(x=>(x.username===user||x.email===user)&&x.password===pass);if(f){localStorage.setItem('wts_fan_session',f.username);localStorage.removeItem('wts_member_session');localStorage.setItem('wts_logged','1');localStorage.setItem('wts_username',f.name);localStorage.setItem('wts_star',String(f.star??100));location.href=new URLSearchParams(location.search).get('return')||'account.html';return}msg.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'};
</script></body></html>
