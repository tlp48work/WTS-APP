<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLP48 Music Audio</title><link rel="stylesheet" href="style.css"></head><body><main class="app tlp"><header class="top"><a href="tlp48.html">‹</a><div class="brand">MUSIC AUDIO</div><a href="account.html">●</a></header><section class="section"><div class="song-slider"><article class="song-slide edn"><div><span class="eyebrow">TLP48 MUSIC</span><h2>UNLOCK & LISTEN</h2><p>ปลดล็อกเพลงด้วย TOKEN</p></div></article></div><h2 class="section-title">SONGS <small style="margin-left:auto;font-size:12px;color:#999">TOKEN: <span id="tokenNow">0</span></small></h2><div id="songsRoot" class="song-grid"></div></section></main><nav class="bottom"><a href="tlp48.html"><span>⌂</span>Home</a><a href="edn-members.html"><span>☷</span>Members</a><a href="edn-music.html" class="active"><span>♫</span>Music</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="wts-cloud.js"></script><script src="site-brand.js"></script><script>const esc=WTSCloud.esc,fmt=n=>Number(n||0).toLocaleString('en-US');async function draw(){const me=await WTSCloud.session();tokenNow.textContent=me?fmt((await WTSCloud.wallet()).token):'0';const a=await WTSCloud.songs('TLP48');const unlocked=await Promise.all(a.map(x=>WTSCloud.isUnlocked(x.id)));songsRoot.innerHTML=a.length?a.map((x,i)=>`<article class="song-card"><div class="song-cover">${x.cover_url?`<img src="${esc(x.cover_url)}" alt="">`:'♫'}</div><div class="song-body"><b>${esc(x.title)}</b><p>${x.release_date||''}</p>${unlocked[i]?(x.audio_url?`<audio controls preload="none" src="${esc(x.audio_url)}"></audio>`:'<span class="unlocked">🔓 UNLOCKED</span>'):`<button class="lock-btn" onclick="unlock('${x.id}')">🔒 UNLOCK • ${fmt(x.token_cost)} TOKEN</button>`}</div></article>`).join(''):'<div class="member-empty">ยังไม่มีเพลงในระบบ</div>'}async function unlock(id){try{const me=await WTSCloud.session();if(!me){location.href='login.html?return=edn-music.html';return}await WTSCloud.unlockSong(id);draw()}catch(e){alert(e.message)}}draw();</script></body></html>
