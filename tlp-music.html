<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLP48 Music Audio</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body class="tlp"><main class="app tlp"><header class="top"><a href="tlp48.html">‹</a><div class="brand">MUSIC AUDIO</div><div class="icons">♫　◉</div></header><div class="music-hero"><article class="music-slide"><div class="music-art">♫</div><span class="eyebrow">TLP48 MUSIC</span><h1 style="margin:7px 0">AUDIO COLLECTION</h1><p>Banner เพลงเปลี่ยนอัตโนมัติ • ใช้ TOKEN เพื่อปลดล็อก</p></article><article class="music-slide"><div class="music-art">♪</div><span class="eyebrow">TOKEN AUDIO</span><h1 style="margin:7px 0">UNLOCK & LISTEN</h1><p>ปลดล็อกเพลงแต่ละเพลงแยกกัน</p></article><article class="music-slide"><div class="music-art">★</div><span class="eyebrow">TLP48</span><h1 style="margin:7px 0">YOUR MUSIC ZONE</h1><p>เพลงที่ปลดล็อกจะอยู่ในบัญชีของคุณ</p></article></div><section class="section"><div class="section-title"><h2>AVAILABLE MUSIC</h2></div><div class="balance"><div><div class="value">🪙 <span id="token">0</span></div><small>TOKEN</small></div><div><div class="value">⭐ <span id="stars">0</span></div><small>STARS</small></div></div><div class="song-grid" id="songs"></div></section></main><nav class="bottom"><a href="tlp48.html"><span>⌂</span>Home</a><a href="tlp-members.html"><span>☷</span>Members</a><a href="tlp-music.html"><span>♫</span>Music</a><a href="major-vote.html"><span>♛</span>Major</a><a href="account.html"><span>●</span>Account</a></nav><script>
const key='tlp'; const all=WTS.get('wts_songs',WTS.seed.songs); const realSongs=all[key]||[]; document.getElementById('token').textContent=localStorage.getItem('wts_token')||10; document.getElementById('stars').textContent=localStorage.getItem('wts_stars')||100;
function renderSongs(){const wrap=document.getElementById('songs');wrap.innerHTML=realSongs.map((s,i)=>{const unlocked=localStorage.getItem('wts_unlock_tlp_'+i)==='1';return `<article class="song-card"><div class="song-cover">♫</div><div><h3>${s.title}</h3><p>${s.desc||'Audio Version'} • ${s.cost} TOKEN</p>${unlocked?`<span class="unlocked">🔓 UNLOCKED • ▶ PLAY AUDIO</span>`:`<button onclick="unlockSong(${i})">🔒 UNLOCK • ${s.cost} TOKEN</button>`}</div></article>`}).join('')}
function unlockSong(i){const cost=Number(realSongs[i].cost||2);let t=Number(localStorage.getItem('wts_token')||10);if(t<cost){alert('TOKEN ไม่พอ');return}t-=cost;localStorage.setItem('wts_token',t);localStorage.setItem('wts_unlock_tlp_'+i,'1');document.getElementById('token').textContent=t;renderSongs()}renderSongs();</script></body></html>
