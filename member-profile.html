<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Profile • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app member-profile-page"><header class="top"><a href="javascript:history.back()">‹</a><div class="brand">MEMBER</div><span>⋯</span></header><div id="profileRoot"></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="shop.html"><span>▣</span>Shop</a><a href="account.html"><span>●</span>Account</a></nav><script src="app.js"></script><script>
const user=WTS.read(WTS.accounts,{users:[]}).users.find(x=>x.username===new URLSearchParams(location.search).get('u'));
function draw(){const r=document.getElementById('profileRoot');if(!user){r.innerHTML='<div class="empty-post">ไม่พบสมาชิก</div>';return}const posts=WTS.read(WTS.posts,[]).filter(p=>p.author===user.username);r.innerHTML=`<section class="member-cover" style="${user.cover?`background-image:url('${user.cover}')`:''}"><div class="member-cover-shade"></div></section><section class="public-profile"><div class="public-avatar">${user.avatar?`<img src="${user.avatar}">`:'○'}</div><h1>${WTS.escapeHtml(user.name)}</h1><p>${WTS.escapeHtml(user.group)} • Generation ${WTS.escapeHtml(user.gen||'—')}</p><div class="public-stats"><div><b>${WTS.fmt(user.stars)}</b><span>STAR</span></div><div><b>${posts.length}</b><span>POSTS</span></div><div><b>${WTS.fmt(user.profileLikes||0)}</b><span>LIKE</span></div></div><div class="public-actions"><button onclick="sendStar()">⭐ STAR</button></div></section><section class="catchup-section"><div class="section-heading"><h2>Timeline</h2><span>โพสต์ของ ${WTS.escapeHtml(user.name)}</span></div><div class="timeline-list">${posts.length?posts.map(p=>`<article class="post-card"><div class="post-head"><div class="mini-avatar">${user.avatar?`<img src="${user.avatar}">`:'○'}</div><div class="post-author"><b>${WTS.escapeHtml(user.name)}</b><small>${new Date(p.createdAt).toLocaleString('th-TH')}</small></div></div><p class="post-text">${WTS.escapeHtml(p.text).replace(/\n/g,'<br>')}</p>${p.image?`<img class="post-media" src="${p.image}">`:''}</article>`).join(''):'<div class="empty-post">ยังไม่มีโพสต์</div>'}</div></section>`}
function sendStar(){if(!WTS.current())return location.href='login.html?return='+encodeURIComponent(location.href);const n=prompt('จำนวน STAR ที่ต้องการส่ง','1');if(!n)return;const res=WTS.sendStarToMember(user.username,n);alert(res.ok?'ส่ง STAR แล้ว':'ไม่สำเร็จ: '+res.msg);draw()}
draw();</script></body></html>
