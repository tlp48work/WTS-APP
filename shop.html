<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOP & MERCHANDISE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="javascript:history.back()">‹</a><div class="brand">SHOP & MERCHANDISE</div><a href="account.html">●</a></header><section class="shop-balance"><div><b data-user-stars>0</b><small>STAR</small></div><div><b data-user-token>0</b><small>TOKEN</small></div></section><section class="shop-section"><div class="section-heading"><h2>BUY STAR</h2><span>1 TOKEN = 1 STAR</span></div><div class="star-pack-grid"><button onclick="buy(10)">⭐ 10 STAR<br><small>10 TOKEN</small></button><button onclick="buy(50)">⭐ 50 STAR<br><small>50 TOKEN</small></button><button onclick="buy(100)">⭐ 100 STAR<br><small>100 TOKEN</small></button></div></section><section class="shop-section"><div class="section-heading"><h2>MERCHANDISE</h2><span>พร้อมส่งตามจำนวนที่ Admin ตั้งไว้</span></div><div id="merchRoot" class="product-grid"></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="shop.html" class="active"><span>▣</span>Shop</a><a href="account.html"><span>●</span>Account</a></nav><script src="app.js"></script><script>
function buy(n){if(!WTS.current())return location.href='login.html?return=shop.html';const r=WTS.buyStar(n);alert(r.ok?'ซื้อ STAR สำเร็จ':'ไม่สำเร็จ: '+r.msg);location.reload()}
function render(){const a=WTS.read(WTS.merch,[]).filter(x=>x.active!==false);const r=document.getElementById('merchRoot');r.innerHTML=a.length?a.map(x=>`<article class="product-card"><div class="product-img">${x.image?`<img src="${x.image}">`:'MERCH'}</div><div class="product-body"><span class="product-tag">${WTS.escapeHtml(x.group||'WAY TO SHINE')}</span><h3>${WTS.escapeHtml(x.name)}</h3><p>${WTS.fmt(x.price)} TOKEN</p><small>เหลือ ${WTS.fmt(x.stock)} ชิ้น</small><button onclick="buyMerch('${x.id}')" ${x.stock<1?'disabled':''}>BUY NOW</button></div></article>`).join(''):'<div class="empty-post">ยังไม่มี Merchandise</div>'}
function buyMerch(id){if(!WTS.requireLogin())return;const u=WTS.current(),a=WTS.read(WTS.merch,[]),x=a.find(z=>z.id===id);if(!x||x.stock<1)return alert('สินค้าหมด');if(u.token<x.price)return alert('TOKEN ไม่พอ');u.token-=x.price;u.inventory=u.inventory||[];u.inventory.push({name:x.name,image:x.image,receivedAt:new Date().toISOString()});if(x.rewardToken)u.token+=Number(x.rewardToken);x.stock--;WTS.save(WTS.merch,a);WTS.saveUser(u);alert('ซื้อสำเร็จ • เพิ่มของเข้า Inventory แล้ว');render()}
render();</script></body></html>
