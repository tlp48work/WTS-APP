<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOP & MERCHANDISE • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="javascript:history.back()">‹</a><div class="brand">SHOP & MERCHANDISE</div><a href="account.html">●</a></header><section class="shop-wrap"><div class="shop-wallet" id="wallet">กำลังโหลด…</div><section class="shop-section"><div class="shop-section-head"><div><span class="eyebrow">CURRENCY</span><h1>ซื้อ STAR ด้วย TOKEN</h1></div></div><div id="starPackages" class="shop-grid"></div></section><section class="shop-section" id="merch"><div class="shop-section-head"><div><span class="eyebrow">SHOP</span><h1>MERCHANDISE</h1></div></div><div id="merchList" class="merch-grid"></div></section></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a href="shop.html" class="active"><span>🛍</span>Shop</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="wts-cloud.js"></script><script src="site-brand.js"></script><script>
const $=id=>document.getElementById(id),esc=WTSCloud.esc,fmt=n=>Number(n||0).toLocaleString('en-US');
async function render(){const me=await WTSCloud.session();if(!me){$('wallet').innerHTML='<div class="shop-login">เข้าสู่ระบบก่อนใช้งาน Shop <a class="primary" href="login.html?return=shop.html">LOGIN</a></div>';return}const [w,packs,ms,inv]=await Promise.all([WTSCloud.wallet(),WTSCloud.packages(),WTSCloud.merch(),WTSCloud.inventory()]);$('wallet').innerHTML=`<div><span>⭐ STAR</span><b>${fmt(w.star)}</b></div><div><span>🪙 TOKEN</span><b>${fmt(w.token)}</b></div><div><span>🎒 INVENTORY</span><b>${fmt(inv.length)}</b></div>`;$('starPackages').innerHTML=packs.map(p=>`<article class="shop-card"><div class="shop-icon">⭐</div><h3>${fmt(p.star_amount)} STAR</h3><p>ใช้ ${fmt(p.token_price)} TOKEN</p><button class="primary" onclick="buyStar('${p.id}')">BUY STAR</button></article>`).join('');$('merchList').innerHTML=ms.length?ms.map(x=>`<article class="merch-card">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name)}">`:'<div class="merch-placeholder">✦</div>'}<div class="merch-info"><span class="merch-tag">${esc(x.group_name)}</span><h3>${esc(x.name)}</h3><p>${fmt(x.price_token)} TOKEN</p><small>รับ ${fmt(x.reward_token)} TOKEN หลังซื้อ${Array.isArray(x.variants)&&x.variants.length?' · สุ่มไอเทม':''}</small><button class="primary" onclick="buyMerch('${x.id}')">BUY NOW</button></div></article>`).join(''):'<div class="timeline-empty"><div>🛍</div><b>ยังไม่มีสินค้า</b><span>Admin จะเพิ่มสินค้าให้ที่นี่</span></div>'}
async function buyStar(id){try{await WTSCloud.buyStarPackage(id);alert('ซื้อ STAR สำเร็จ');render()}catch(e){alert(e.message)}}async function buyMerch(id){try{const r=await WTSCloud.buyMerch(id);alert(`ซื้อสำเร็จ! ได้รับ ${r.item}${r.token!=null?' และยอด TOKEN อัปเดตแล้ว':''}`);render()}catch(e){alert(e.message)}}render();</script></body></html>
