<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOP & MERCHANDISE • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="wts-app.js"></script></head><body><main class="app"><header class="top"><a href="javascript:history.back()">‹</a><div class="brand">SHOP & MERCHANDISE</div><a href="account.html">●</a></header><section class="section"><div class="shop-wallet"><div>⭐ <b id="stars">0</b><small>STAR</small></div><div>🪙 <b id="tokens">0</b><small>TOKEN</small></div><a href="#starshop">Buy STAR ›</a></div><h2 class="section-title">STAR SHOP</h2><div class="star-buy card"><div><b>STAR PACK</b><small>เติม STAR ด้วย TOKEN</small></div><strong id="pack">100 ⭐</strong><button class="primary" onclick="buyStar()" id="starBuy">10 TOKEN</button></div><h2 class="section-title">MERCHANDISE</h2><div id="merch" class="shop-grid"></div><h2 class="section-title">MY INVENTORY</h2><div id="inventory" class="inventory-grid"></div></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>Home</a><a href="spark.html"><span>★</span>Spark</a><a class="active" href="shop.html"><span>♜</span>Shop</a><a href="major-vote.html"><span>▣</span>Vote</a><a href="account.html"><span>●</span>Account</a></nav><script>
function current(){const u=WTS.user();if(!u){location.href='login.html?return=shop.html';return null}const d=WTS.load(),f=d.fans.find(x=>x.id===u.id);if(!f){alert('Shop สำหรับแฟนคลับ');location.href='account.html';return null}return {d,f,u}}
function render(){const x=current();if(!x)return;stars.textContent=WTS.fmt(x.f.star);tokens.textContent=WTS.fmt(x.f.token);pack.textContent=(x.d.settings.starPack||100)+' ⭐';starBuy.textContent=(x.d.settings.starCost||10)+' TOKEN';merch.innerHTML=x.d.merch.map(m=>`<article class="product-card"><div class="product-image">${m.image?`<img src="${m.image}">`:'✦'}</div><div class="product-body"><b>${WTS.esc(m.name)}</b><span>${m.price} TOKEN</span><small>รับ Token +${m.reward}</small><button class="primary" onclick="buyMerch('${m.id}')">BUY NOW</button></div></article>`).join('')||'<div class="empty-small">ยังไม่มี Merchandise</div>';inventory.innerHTML=x.f.inventory.map(i=>`<div class="inventory-item"><span>🎁</span><b>${WTS.esc(i.name)}</b><small>${new Date(i.received).toLocaleDateString('th-TH')}</small></div>`).join('')||'<div class="empty-small">Inventory ว่าง</div>'}
function buyStar(){const x=current();if(!x)return;const cost=x.d.settings.starCost||10,reward=x.d.settings.starPack||100;if(x.f.token<cost)return alert('TOKEN ไม่พอ');x.f.token-=cost;x.f.star+=reward;WTS.save(x.d);alert('ได้รับ STAR แล้ว ✨');render()}
function buyMerch(id){const x=current(),m=x.d.merch.find(z=>z.id===id);if(!m)return;if(x.f.token<m.price)return alert('TOKEN ไม่พอ');const now=Date.now(),st=m.start?new Date(m.start).getTime():0,en=m.end?new Date(m.end).getTime():Infinity;if(now<st||now>en)return alert('สินค้านี้ยังไม่อยู่ในช่วงจำหน่าย');x.f.token-=m.price;if(m.reward)x.f.token+=m.reward;x.f.inventory.push({id:WTS.uid('inv'),name:m.name,image:m.image,received:Date.now()});WTS.save(x.d);alert('ซื้อสำเร็จ! ไอเท็มเข้า Inventory แล้ว 🎁');render()}
document.addEventListener('DOMContentLoaded',render)
</script></body></html>
