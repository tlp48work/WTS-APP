<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">ADMIN PANEL</div><span>⚙</span></header><section class="section"><div class="admin-note"><b>ADMIN CMS</b><br>เพิ่มสมาชิก เพลง และพื้นหลังได้จากหน้านี้</div><div id="loginBox" class="form-card" style="margin:0"><h1>ADMIN LOGIN</h1><div class="field"><label>ADMIN CODE</label><input id="code" type="password"></div><button class="primary" onclick="loginAdmin()">ENTER ADMIN</button></div><div id="panel" style="display:none"><h2 class="section-title">MEMBERS</h2><div class="cards"><div class="card"><b>EDN48</b><div class="field"><label>Name</label><input id="en"></div><div class="field"><label>Generation</label><select id="eg"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="field"><label>Real Name</label><input id="er"></div><div class="field"><label>Age</label><input id="ea"></div><div class="field"><label>Photo URL</label><input id="ep"></div><button class="primary" onclick="addM('EDN48')">+ ADD EDN48 MEMBER</button></div><div class="card"><b>TLP48</b><div class="field"><label>Name</label><input id="tn"></div><div class="field"><label>Generation</label><select id="tg"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="field"><label>Real Name</label><input id="tr"></div><div class="field"><label>Age</label><input id="ta"></div><div class="field"><label>Photo URL</label><input id="tp"></div><button class="primary" onclick="addM('TLP48')">+ ADD TLP48 MEMBER</button></div></div><h2 class="section-title">MUSIC</h2><div class="cards"><div class="card"><b>EDN48</b><div class="field"><label>Song</label><input id="es"></div><div class="field"><label>Release</label><input id="ed"></div><div class="field"><label>Cover URL</label><input id="ec" placeholder="https://..."></div><div class="field"><label>Audio URL</label><input id="eaudio" placeholder="https://...mp3"></div><button class="primary" onclick="addS('EDN48')">+ ADD SONG</button></div><div class="card"><b>TLP48</b><div class="field"><label>Song</label><input id="ts"></div><div class="field"><label>Release</label><input id="td"></div><div class="field"><label>Cover URL</label><input id="tc" placeholder="https://..."></div><div class="field"><label>Audio URL</label><input id="taudio" placeholder="https://...mp3"></div><button class="primary" onclick="addS('TLP48')">+ ADD SONG</button></div></div><h2 class="section-title">BACKGROUND</h2><div class="card"><div class="field"><label>CSS Background</label><input id="bg" placeholder="linear-gradient(...)" /></div><button class="primary" onclick="saveBg()">SAVE BACKGROUND</button></div><div class="admin-actions"><button onclick="exportData()">EXPORT CONTENT JSON</button><button class="secondary" onclick="localStorage.removeItem('wts_admin');location.reload()">LOGOUT</button></div></div></section></main><script>const ADMIN='WTS-ADMIN-2026';function loginAdmin(){if(code.value!==ADMIN)return alert('รหัสแอดมินไม่ถูกต้อง');localStorage.setItem('wts_admin',1);show()}function show(){loginBox.style.display='none';panel.style.display='block'}if(localStorage.getItem('wts_admin')==='1')show();function addM(g){let x=g==='EDN48'?{name:en.value,gen:eg.value,real:er.value,age:ea.value,photo:ep.value}:{name:tn.value,gen:tg.value,real:tr.value,age:ta.value,photo:tp.value};if(!x.name)return alert('กรอกชื่อ');let d=JSON.parse(localStorage.getItem('wts_members_v1')||'{}');d[g]=d[g]||[];d[g].push(x);localStorage.setItem('wts_members_v1',JSON.stringify(d));alert('เพิ่มสมาชิกแล้ว')}function addS(g){let x=g==='EDN48'?{title:es.value,release:ed.value,cover:ec.value,audio:eaudio.value}:{title:ts.value,release:td.value,cover:tc.value,audio:taudio.value};if(!x.title)return alert('กรอกชื่อเพลง');let d=JSON.parse(localStorage.getItem('wts_songs_v1')||'{}');d[g]=d[g]||[];d[g].push(x);localStorage.setItem('wts_songs_v1',JSON.stringify(d));alert('เพิ่มเพลงแล้ว')}function saveBg(){if(!bg.value.trim())return;localStorage.setItem('wts_bg',bg.value);alert('บันทึกพื้นหลังแล้ว')}function exportData(){let d={members:JSON.parse(localStorage.getItem('wts_members_v1')||'{}'),songs:JSON.parse(localStorage.getItem('wts_songs_v1')||'{}'),background:localStorage.getItem('wts_bg')||''};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='way-to-shine-content.json';a.click()}</script></body></html>
