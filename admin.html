<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a href="index.html">‹</a><b>ADMIN PANEL</b><a href="index.html">⌂</a></header><main class="admin"><div class="profile-hero"><div class="avatar">⚙</div><h1>WAY TO SHINE ADMIN</h1><p>จัดการสมาชิก / ข้อมูล / Banner</p></div><div id="login" class="box"><h2>ADMIN LOGIN</h2><input class="input" id="pin" placeholder="Admin Code" type="password"><button onclick="adminLogin()">LOGIN</button><p class="notice">Demo admin code: WTS-ADMIN-2026</p></div><div id="panel" style="display:none"><div class="box"><h2>เพิ่มสมาชิก</h2><label>Group</label><select class="input" id="group"><option>TLP48</option><option>EDN48</option></select><label>Generation</label><select class="input" id="gen"><option>1</option><option>2</option><option>3</option><option>4</option></select><label>ชื่อ</label><input class="input" id="name"><label>ชื่อจริง</label><input class="input" id="real"><label>อายุ</label><input class="input" id="age"><label>Instagram</label><input class="input" id="ig"><label>ข้อมูล</label><textarea class="input" id="info"></textarea><button onclick="add()">+ ADD MEMBER</button></div><div class="box admin-list"><h2>โปรไฟล์ที่ Admin เพิ่ม</h2><div id="list"></div></div><div class="box"><h2>จำนวนเริ่มต้น</h2><p>TLP48: Gen1 2 • Gen2 4 • Gen3 2 • Gen4 7</p><p>EDN48: Gen1 5 • Gen2 11 • Gen3 13</p></div></div></main><script>
const key='wts_admin_members';
function adminLogin(){if(pin.value==='WTS-ADMIN-2026'){login.style.display='none';panel.style.display='block';render()}else alert('Admin Code ไม่ถูกต้อง')}
function arr(){return JSON.parse(localStorage.getItem(key)||'[]')}
function add(){let a=arr();a.push({group:group.value,gen:gen.value,name:name.value,real:real.value,age:age.value,ig:ig.value,info:info.value});localStorage.setItem(key,JSON.stringify(a));render();alert('เพิ่มโปรไฟล์แล้ว')}
function del(i){let a=arr();a.splice(i,1);localStorage.setItem(key,JSON.stringify(a));render()}
function render(){list.innerHTML=arr().map((m,i)=>'<div class="list-row"><span class="list-icon">👤</span><span><b>'+m.group+' GEN '+m.gen+'</b><br>'+m.name+'<br><small>'+m.real+' • '+m.age+' • '+m.ig+'</small></span><button onclick="del('+i+')">ลบ</button></div>').join('')||'<p style="color:#888">ยังไม่มีข้อมูลที่เพิ่ม</p>'}
</script></body></html>
