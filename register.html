<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div></header><section class="auth-wrap"><div class="auth-card"><h1>Create account ✦</h1><p style="color:#888">สมัครสมาชิกแล้วเข้าสู่ My Account</p><div class="field"><label>DISPLAY NAME</label><input id="name" placeholder="ชื่อที่ต้องการแสดง"></div><div class="field"><label>EMAIL</label><input id="email" type="email" placeholder="email@example.com"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" placeholder="อย่างน้อย 6 ตัวอักษร"></div><button class="primary fullbtn" onclick="register()">CREATE ACCOUNT</button><div class="switch-auth">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></div></div></section></main><script>function register(){const n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim();if(!n||!e){alert('กรอกข้อมูลให้ครบ');return}localStorage.setItem('wts_user',n);localStorage.setItem('wts_email',e);localStorage.setItem('wts_token','10');localStorage.setItem('wts_stars','100');localStorage.setItem('wts_major','5');localStorage.setItem('wts_oshi','[]');alert('สมัครสมาชิกสำเร็จ');location.href='account.html'}</script></body></html>
