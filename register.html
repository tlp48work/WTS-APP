<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div></header><form class="form-card" id="regForm"><h1>REGISTER</h1><p class="muted">สร้างบัญชีแฟนคลับของคุณ</p><div class="field"><label>USERNAME</label><input id="u" required></div><div class="field"><label>EMAIL</label><input id="em" required type="email"></div><div class="field"><label>PASSWORD</label><input id="pw" required type="password"></div><button class="primary">CREATE ACCOUNT</button><p id="msg" class="form-msg"></p></form></main><script>
const FAN='wts_fan_accounts_v1';const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};document.getElementById('regForm').onsubmit=e=>{e.preventDefault();let a=get(FAN,[]);if(a.some(x=>x.username===u.value.trim()||x.email===em.value.trim())){msg.textContent='Username หรือ Email นี้ถูกใช้แล้ว';return}const x={type:'fan',username:u.value.trim(),email:em.value.trim(),password:pw.value,name:u.value.trim(),star:100,createdAt:Date.now()};a.push(x);localStorage.setItem(FAN,JSON.stringify(a));localStorage.setItem('wts_fan_session',x.username);localStorage.removeItem('wts_member_session');localStorage.setItem('wts_logged','1');localStorage.setItem('wts_username',x.name);location.href='account.html'};
</script></body></html>
