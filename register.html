<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div><span>♡</span></header><form class="form-card" onsubmit="go(event)"><div class="login-badge fan">♡</div><h1>REGISTER</h1><p class="muted">สร้างบัญชีแฟนคลับ แล้วปรับรูปโปรไฟล์ของตัวเองได้ใน MY ACCOUNT</p><div class="field"><label>USERNAME</label><input id="u" required></div><div class="field"><label>EMAIL</label><input id="e" required type="email"></div><div class="field"><label>PASSWORD</label><input id="p" required type="password" minlength="4"></div><button class="primary">CREATE ACCOUNT</button><p id="msg" class="form-msg"></p></form></main><script>
function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function go(ev){ev.preventDefault();let d=get('wts_fan_accounts_v1',[]);if(d.some(x=>x.username===u.value.trim()||x.email===e.value.trim())){msg.textContent='Username หรือ Email นี้ถูกใช้แล้ว';return}const a={username:u.value.trim(),email:e.value.trim(),password:p.value,name:u.value.trim(),photo:'',cover:'',group:'FAN',oshi:0,kamiOshi:0,likes:0,createdAt:Date.now()};d.push(a);localStorage.setItem('wts_fan_accounts_v1',JSON.stringify(d));localStorage.setItem('wts_session_type','fan');localStorage.setItem('wts_session_user',a.username);localStorage.setItem('wts_logged','1');localStorage.setItem('wts_username',a.name);localStorage.setItem('wts_token','10');localStorage.setItem('wts_star','100');location.href='account.html'}
</script><script src="wts-core.js"></script><script src="site-brand.js"></script></body></html>
