<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div></header><form class="form-card" onsubmit="go(event)"><h1>REGISTER</h1><div class="field"><label>USERNAME</label><input id="u" required></div><div class="field"><label>EMAIL</label><input required type="email"></div><div class="field"><label>PASSWORD</label><input required type="password"></div><button class="primary">CREATE ACCOUNT</button></form></main><script>function go(e){e.preventDefault();localStorage.setItem('wts_logged',1);localStorage.setItem('wts_username',u.value);localStorage.setItem('wts_token',10);localStorage.setItem('wts_star',100);localStorage.setItem('wts_major',0);location.href='account.html'}</script></body></html>
