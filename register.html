<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div><span>♡</span></header><form class="form-card" id="regForm"><div class="login-badge fan">♡</div><h1>REGISTER</h1><p class="muted">สร้างบัญชีแฟนคลับสำหรับ STAR / TOKEN / Oshi / Inventory</p><div class="field"><label>USERNAME</label><input id="username" required minlength="3" maxlength="32"></div><div class="field"><label>EMAIL</label><input id="email" required type="email"></div><div class="field"><label>PASSWORD</label><input id="password" required type="password" minlength="8"></div><button class="primary" id="btn">CREATE ACCOUNT</button><p id="msg" class="form-msg"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="wts-cloud.js"></script><script src="site-brand.js"></script><script>regForm.onsubmit=async e=>{e.preventDefault();msg.textContent='กำลังสร้างบัญชี…';btn.disabled=true;try{const r=await WTSCloud.signUp({username:username.value.trim(),email:email.value.trim(),password:password.value,displayName:username.value.trim()});if(r?.needsEmailConfirm){msg.textContent='สร้างบัญชีแล้ว กรุณายืนยัน Email ก่อน Login';return}location.href='account.html'}catch(err){msg.textContent=err.message||'สมัครไม่สำเร็จ'}finally{btn.disabled=false}};</script></body></html>
