<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="app auth-page"><header class="top glass"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div></header><form class="auth-card" id="form"><div class="auth-logo">♡</div><span class="eyebrow">FOR FANS</span><h1>CREATE ACCOUNT</h1><p>สมัครสมาชิกแฟนคลับ แล้วเริ่มสะสม STAR / TOKEN ได้เลย</p><label>USERNAME<input id="u" required></label><label>EMAIL<input id="em" type="email" required></label><label>PASSWORD<input id="pw" type="password" required></label><button class="primary">CREATE FAN ACCOUNT</button><div id="msg" class="form-msg"></div><a href="login.html">มีบัญชีแล้ว? <b>Login</b></a></form></main><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();const u=document.getElementById('u').value.trim(),em=document.getElementById('em').value.trim().toLowerCase(),p=document.getElementById('pw').value,msg=document.getElementById('msg');if(!u||!em||!p){msg.textContent='กรอกข้อมูลให้ครบก่อนนะ ✦';return}const arr=WTS.read(WTS.K.fan,[]),acc=WTS.read(WTS.K.accounts,[]),un=u.toLowerCase();if(arr.some(x=>String(x.username||'').trim().toLowerCase()===un||String(x.email||'').trim().toLowerCase()===em)||acc.some(x=>String(x.username||'').trim().toLowerCase()===un)){msg.textContent='Username หรือ Email นี้ถูกใช้แล้ว';return}const x={id:'fan_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),type:'fan',username:u,email:em,password:p,name:u,token:20,star:5,oshiList:[],profile:{},createdAt:Date.now()};arr.push(x);WTS.write(WTS.K.fan,arr);WTS.login(x);location.href='account.html'};</script></body></html>
