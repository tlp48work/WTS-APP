<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register • WAY TO SHINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand">WAY TO SHINE</div><span>♡</span></header><form class="form-card" onsubmit="go(event)"><h1>CREATE FAN ACCOUNT</h1><p class="muted">สำหรับแฟนคลับ • บัญชีสมาชิกวงจะถูกสร้างโดย Admin</p><div class="field"><label>DISPLAY NAME</label><input id="n" required></div><div class="field"><label>USERNAME</label><input id="u" autocomplete="username" required></div><div class="field"><label>EMAIL</label><input id="e" required type="email"></div><div class="field"><label>PASSWORD</label><input id="p" required type="password" autocomplete="new-password"></div><button class="primary">CREATE ACCOUNT</button><p id="msg" class="form-msg"></p></form></main><script>
const KEY='wts_fan_accounts_v1';function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function go(ev){ev.preventDefault();const d=get();const username=u.value.trim(),email=e.value.trim();if(d.some(x=>x.username===username||x.email===email)){msg.textContent='Username หรือ Email นี้ถูกใช้แล้ว';return}const a={username,email,password:p.value,name:n.value.trim(),photo:'',cover:'',star:100,token:10,major:0,oshiCount:0,kamiCount:0,likes:0,createdAt:Date.now()};d.push(a);localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem('wts_session_v2',JSON.stringify({role:'fan',username:a.username}));localStorage.setItem('wts_logged','1');localStorage.setItem('wts_username',a.name);location.href='account.html'}
</script></body></html>
