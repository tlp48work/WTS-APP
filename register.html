<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="style.css"></head><body><main class="page "><header class="top"><div class="topin"><a class="brand" href="index.html">← WAY TO SHINE</a><a class="icon" href="account.html">👤</a></div></header><main class="login"><div class="loginbox"><h1>สมัครสมาชิก</h1><input id="name" placeholder="ชื่อที่แสดง"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password อย่างน้อย 6 ตัว"><input id="kami" placeholder="สมาชิกที่ Oshi"><select id="rank"><option>Oshi</option><option>Kami-Oshi</option><option>Premium Kami-Oshi</option></select><button class="formbtn" onclick="reg()">CREATE ACCOUNT</button><p id="msg" class="small"></p><a class="btn" href="login.html">กลับ Login</a></div></main></main><script src="app.js"></script></body></html><script>function reg(){if(!name.value||!email.value||pass.value.length<6)return msg.textContent="กรอกข้อมูลให้ครบ";let us=JSON.parse(localStorage.getItem("wts_users")||"{}");if(us[email.value])return msg.textContent="Email นี้มีแล้ว";let u={name:name.value,email:email.value,password:pass.value,kami:kami.value,kamiRank:rank.value,oshi:kami.value?[kami.value]:[],star:20,token:10,major:5,unlocked:[]};us[email.value]=u;localStorage.setItem("wts_users",JSON.stringify(us));save(u);location.href="account.html"}</script>
