<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิก • WAY TO SHINE</title><link rel="stylesheet" href="style.css"><script src="wts-app.js"></script></head><body><main class="app"><header class="top"><a href="index.html">‹</a><div class="brand" data-wts-brand>WAY TO SHINE</div></header><form class="form-card" id="reg"><div class="login-mark">♡</div><h1>สร้างบัญชีแฟนคลับ</h1><div class="field"><label>DISPLAY NAME</label><input id="n" required></div><div class="field"><label>USERNAME</label><input id="u" required></div><div class="field"><label>PASSWORD</label><input id="p" type="password" minlength="4" required></div><button class="primary">CREATE ACCOUNT</button></form></main><script>reg.onsubmit=e=>{e.preventDefault();const d=WTS.load();if(d.fans.some(x=>x.username===u.value.trim()))return alert('Username นี้ถูกใช้แล้ว');const f={id:WTS.uid('fan'),name:n.value.trim(),username:u.value.trim(),password:p.value,avatar:'',cover:'',star:100,token:10,major:0,oshi:[],inventory:[]};d.fans.push(f);WTS.save(d);WTS.setUser({id:f.id,role:'fan',name:f.name});location.href='account.html'}</script></body></html>
